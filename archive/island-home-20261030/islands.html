<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06161d">
  <title>知識群島（原型）</title>
  <style>
    :root{--water1:#0a2a33;--water2:#06161d;--ripple:rgba(127,255,227,.10);--top:#173f48;--grass:#1f5a5c;--base:#0f2c33;--base2:#0b2128;--base3:#08181e;
      --label:rgba(7,30,38,.94);--label-text:#d7f6f0;--label-line:rgba(127,255,227,.35);--panel:rgba(4,26,33,.72);--line:rgba(127,255,227,.22);
      --text:#d7eef0;--muted:#8fb4ba;--accent:#7fffe3;--warn:#ffd9a8;--trunk:#7a5b3c;--leaf:#2f8f7d;--leaf2:#3fae95;--wall:#cfd8cf;--wall2:#aab8b3;--shadow:rgba(0,0,0,.28)}
    :root[data-theme="day"]{--water1:#d9ece6;--water2:#bfdad3;--ripple:rgba(255,255,255,.55);--top:#eae6cc;--grass:#dfe9d2;--base:#b9a47f;--base2:#a28d6a;--base3:#8d795a;
      --label:#fff;--label-text:#24454c;--label-line:rgba(36,69,76,.2);--panel:rgba(255,255,255,.7);--line:rgba(36,69,76,.2);--text:#24454c;--muted:#5c7a80;--accent:#1d6f8f;
      --warn:#b5651d;--trunk:#8a6a48;--leaf:#8bb9a5;--leaf2:#a7cdb9;--wall:#f1eadb;--wall2:#d8cfba;--shadow:rgba(60,80,70,.18)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(1200px 700px at 30% 20%,var(--water1),var(--water2));font:14px/1.55 "Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}
    a{color:inherit}
    header{display:flex;align-items:center;gap:14px;padding:14px 22px}
    header h1{margin:0;font-size:18px}
    header small{color:var(--muted)}
    header .sp{flex:1}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--text);text-decoration:none;cursor:pointer;font:inherit;font-size:13px}
    .btn.primary{background:var(--accent);color:#04202a;border-color:transparent;font-weight:600}
    :root[data-theme="day"] .btn.primary{color:#fff}
    .stage{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;padding:0 22px 24px}
    @media(max-width:900px){.stage{grid-template-columns:1fr}}
    .map{position:relative;border:1px solid var(--line);border-radius:18px;overflow:hidden;min-height:480px;background:radial-gradient(800px 460px at 50% 40%,transparent,rgba(0,0,0,.12))}
    svg{display:block;width:100%;height:auto}
    .ripple{fill:none;stroke:var(--ripple);stroke-width:2}
    .island{cursor:pointer;outline:none}
    .island .lift{transition:transform .22s ease}
    .island:hover .lift,.island:focus-visible .lift,.island.on .lift,.island.hot .lift{transform:translateY(-9px)}
    .island .ground{fill:var(--shadow)}
    .tag-layer .lab{transition:transform .22s ease}.tag-layer.on .lab,.tag-layer:hover .lab{transform:translate(0,18px)}
    .lab rect{fill:var(--label);stroke:var(--label-line);stroke-width:1;transition:fill .2s}
    .lab text{fill:var(--label-text);font-size:13px;font-weight:600;text-anchor:middle;pointer-events:none}
    .island.on .lab rect,.island:focus-visible .lab rect{fill:var(--accent);stroke:none}
    .island.on .lab text,.island:focus-visible .lab text{fill:#04202a}
    :root[data-theme="day"] .island.on .lab text{fill:#fff}
    .badge circle{fill:#ff8a5c}.badge text{fill:#fff;font-size:11px;font-weight:700;text-anchor:middle;pointer-events:none}
    .live-dot{fill:#7fffe3}
    .legend{position:absolute;left:14px;bottom:12px;display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--muted)}
    .legend span{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
    .legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
    .hint{position:absolute;right:14px;bottom:12px;color:var(--muted);font-size:12px}
    aside.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;align-self:start;position:sticky;top:12px}
    .panel .eyebrow{color:var(--muted);font-size:11px;letter-spacing:.12em}
    .panel h2{margin:4px 0 2px;font-size:20px}
    .panel p{margin:0 0 12px;color:var(--muted)}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center}
    .stats strong{display:block;font-size:20px;line-height:1.2}
    .stats small{color:var(--muted);font-size:11px}
    .stats .warn strong{color:var(--warn)}
    .latest{margin:12px 0;min-height:3em;font-size:13px}
    .actions{display:flex;gap:8px}.actions .btn{flex:1;border-radius:10px}
    .tag{display:inline-block;margin-left:8px;padding:1px 9px;border-radius:999px;font-size:11px;vertical-align:middle;border:1px solid var(--line);color:var(--muted)}
    .tag.live{color:var(--accent);border-color:var(--accent)}
    .list{display:none;margin:14px 0 0;padding:0;list-style:none;gap:6px}
    @media(max-width:900px){.list{display:flex;flex-wrap:wrap}}
    .list a{display:inline-block;padding:4px 10px;border:1px solid var(--line);border-radius:999px;text-decoration:none;font-size:13px}
    .pill{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13px}
    .pill i{width:8px;height:8px;border-radius:50%;background:#4cd964;box-shadow:0 0 0 3px rgba(76,217,100,.2)}
    .btn.small{padding:4px 10px;font-size:12px}
    .people .av{cursor:default}
    .fig{transform-box:view-box;transform-origin:0 0}
    .fig.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
    .fig.out{animation:out .34s ease-in forwards}
    @keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
    @keyframes out{to{opacity:0;transform:scale(.2)}}
    #scene.nopeople .people{display:none}
    #tip{position:fixed;z-index:5;pointer-events:none;padding:3px 10px;border-radius:999px;background:var(--label);color:var(--label-text);border:1px solid var(--label-line);font-size:12px;white-space:nowrap}
    .crowd{margin:10px 0 0;color:var(--muted);font-size:13px}.crowd strong{color:var(--accent)}
    @media (prefers-reduced-motion:reduce){.fig.pop,.fig.out{animation:none}}
    .modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(2,12,16,.62)}
    .modal[hidden],.card[hidden],.toast[hidden]{display:none}
    .sheet{position:relative;width:min(720px,100%);max-height:88vh;overflow:auto;background:var(--water2);border:1px solid var(--line);border-radius:18px;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
    :root[data-theme="day"] .sheet{background:#fff}
    .sheet h2{margin:0 0 4px;font-size:20px}.sheet .sum{margin:0 0 12px;color:var(--muted)}.sheet .sum strong{color:var(--accent)}
    .x{position:absolute;right:12px;top:8px;background:none;border:0;color:var(--text);font-size:24px;cursor:pointer;line-height:1}
    .tabs{display:flex;gap:6px;margin:6px 0 12px}
    .tabs button{padding:6px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer;font:inherit}
    .tabs button[aria-selected="true"]{background:var(--accent);color:#04202a;border-color:transparent;font-weight:600}
    .blist,.agrid,.clist{list-style:none;margin:0;padding:0}
    .brow{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
    .bi{display:grid;place-items:center;color:var(--muted)}
    .bline{display:flex;justify-content:space-between;gap:8px}.bline span{color:var(--muted);font-size:13px}
    .bar{height:6px;border-radius:99px;background:rgba(127,255,227,.12);overflow:hidden;margin:4px 0}.bar i{display:block;height:100%;border-radius:99px}
    .brow small{color:var(--muted);font-size:12px}
    .note{color:var(--muted);margin:0 0 10px}
    .agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
    .acard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border:1px solid var(--line);border-radius:12px;text-align:center}
    .acard.on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(127,255,227,.25)}
    .acard.locked .apic{filter:grayscale(1) brightness(.6);opacity:.7}.acard small{color:var(--muted);font-size:11px}
    .sim{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);color:var(--muted);font-size:12px}
    .sim select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:3px 6px}
    .card{position:fixed;z-index:15;width:250px;background:var(--water2);border:1px solid var(--accent);border-radius:14px;padding:12px 14px;box-shadow:0 12px 36px rgba(0,0,0,.4)}
    :root[data-theme="day"] .card{background:#fff}
    .chead{display:flex;gap:10px;align-items:center}.chead small{display:block;color:var(--muted);font-size:12px}
    .csum{margin:8px 0;color:var(--muted);font-size:12px}
    .clist li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:4px 0;border-top:1px solid var(--line);font-size:13px}.clist em{font-style:normal;color:var(--muted);font-size:12px}
    .card .btn.small{margin-top:8px;width:100%}
    .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:30;padding:10px 18px;border-radius:999px;background:var(--accent);color:#04202a;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.35)}
    noscript{display:block;padding:20px}
  </style>
</head>
<body>
  <header>
    <h1>知識群島</h1><small>每個專區是一座島，點島看摘要，按「進入專區」前往</small><span class="sp"></span>
    <span class="pill" title="原型：模擬的在線人數"><i></i><span id="online">0 人在線</span></span>
    <button class="btn small" id="addUser" type="button" title="原型用">＋模擬上線</button><button class="btn small" id="delUser" type="button" title="原型用">－模擬離線</button>
    <button class="btn small" id="meBtn" type="button">我的徽章與動物</button>
    <button class="btn small" id="people" type="button" aria-pressed="true">隱藏人物</button>
    <button class="btn" id="theme" type="button" aria-pressed="false">切換日間</button>
    <a class="btn" href="/hub/">卡片檢視</a>
  </header>
  <div class="stage">
    <section class="map" aria-label="知識專區群島地圖">
      <svg id="scene" role="group" aria-label="知識專區群島" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="legend" id="legend"></div>
      <div class="hint">點島查看 · 雙擊或 Enter 進入專區</div>
    </section>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  <div id="tip" hidden></div>
  </div>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="rainbow" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ff5b5b"/><stop offset=".25" stop-color="#ffc83d"/><stop offset=".5" stop-color="#4cd7a0"/><stop offset=".75" stop-color="#4aa8ff"/><stop offset="1" stop-color="#b57cff"/></linearGradient></defs></svg>
  <div id="me" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="meTitle"><div class="sheet"></div></div>
  <div id="card" class="card" hidden role="dialog" aria-label="人物徽章"></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript>需要 JavaScript 才能顯示群島地圖。</noscript>
<script>
(() => {
  'use strict';
  /* Zones, groups and numbers. In the real page these come from the same data the card view uses (loadAll() in hub-1-data.js). */
  const GROUPS = [
    { label: '技術類', rim: '#2f9bd4', roof: '#e4673d', ids: ['wifi', 'mobile', 'cpe', 'smallcell', 'broadband'] },
    { label: '測試與認證類', rim: '#e0a82e', roof: '#8a72c0', ids: ['csit', 'cert', 'integrations'] },
    { label: '資源與管理類', rim: '#e0603f', roof: '#2f78b0', ids: ['equipment', 'lab', 'admin'] },
  ];
  const ZONES = {
    wifi: { name: 'WiFi 知識專區', tag: '即時', tagline: 'Wi-Fi 8 / 802.11bn 規格與 WFA 文件問答', url: '/wifi8/', stats: [367, 136, 0, 2], latest: '近期沒有更新', build: 'tower', at: [0, -1] },
    mobile: { name: '4G/5G 知識專區', tagline: '3GPP 規範與 LTE / 5G NR 技術文件', stats: [15, 7, 3, 2], latest: '5G NR Handover 測試案例與結果彙整（10/28）', build: 'tower', at: [1, -1] },
    cpe: { name: 'CPE 知識專區', tagline: 'CPE 機種規格、韌體測試與業者規範', stats: [10, 7, 3, 2], latest: 'RTF5510CP-A104 韌體 2.3.1 回歸測試報告（10/27）', build: 'house', at: [2, -1] },
    smallcell: { name: 'Smallcell 知識專區', tagline: 'Small Cell 部署、OAM 與 O-RAN 互通', stats: [10, 5, 2, 2], latest: 'SC3200-IN 射頻一致性測試報告（10/26）', build: 'dome', at: [1, 0] },
    broadband: { name: '固網寬頻知識專區', tagline: 'PON / Cable 技術與 Broadband Forum 規範', stats: [9, 5, 2, 2], latest: 'XGS-PON ONU 光功率與吞吐量測試報告（10/27）', build: 'house', at: [0, 1] },
    csit: { name: 'CSIT 雜項專區', tagline: 'CSIT 測試報告、申請單與測試計畫', stats: [15, 7, 3, 2], latest: 'RTF7907VW-D223 Wi-Fi 7 功能與效能測試計畫（10/27）', build: 'house', at: [-1, 0] },
    cert: { name: '認證與法規知識專區', tagline: 'Wi-Fi、藍牙、GCF、PTCRB 認證與法規', stats: [10, 5, 1, 2], latest: 'RTF7907VW-D223 Wi-Fi 7 認證計畫（10/26）', build: 'dome', at: [-1, 1] },
    integrations: { name: 'Confluence / Jira / TestRail 查詢專區', short: 'Jira / TestRail', tagline: 'Confluence、Jira、TestRail 整合查詢', stats: [10, 7, 3, 2], latest: 'RTF5510CP-A104 韌體 2.3.1 回歸測試執行結果（10/27）', build: 'tower', at: [0, 0] },
    equipment: { name: '設備預約知識專區', tagline: '設備資訊、預約規範與校驗', stats: [9, 4, 2, 1], latest: '示範資料', build: 'house', at: [1, 1] },
    lab: { name: '實驗室與測試環境知識專區', short: '實驗室與測試環境', tagline: '實驗室規劃、建置與測試環境', stats: [8, 3, 1, 1], latest: '示範資料', build: 'dome', at: [2, 0] },
    admin: { name: '部門與公司文管專區', tagline: '週報、工時、人事行政與請款', stats: [12, 6, 2, 1], latest: '示範資料', build: 'house', at: [0, 2] },
  };
  Object.keys(ZONES).forEach((id) => { const z = ZONES[id]; z.id = id; z.url = z.url || `/zones/${id}/`; z.group = GROUPS.find((g) => g.ids.includes(id)); });

  const GEO = {};
  const R = 74, K = 0.56, GAP = 1.3, T = 20;
  const NS = 'http://www.w3.org/2000/svg';
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pts = (list) => list.map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const hex = (s = 1) => [0, 1, 2, 3, 4, 5].map((i) => { const a = Math.PI / 3 * i; return [R * s * Math.cos(a), R * s * Math.sin(a) * K]; });
  const shade = (hexColor, f) => { const n = parseInt(hexColor.slice(1), 16); const c = (v) => Math.max(0, Math.min(255, Math.round(v * f))); return `rgb(${c(n >> 16)},${c((n >> 8) & 255)},${c(n & 255)})`; };

  /* ---- small solid shapes, all drawn around a ground point (x, y) ---- */
  function roof(x, y, w, h, rh, color) {
    const top = y - h, apex = [x, top - w * 0.5 - rh];
    const left = [[x - w, top - w * 0.5], [x, top], apex], right = [[x, top], [x + w, top - w * 0.5], apex];
    return `<polygon points="${pts(left)}" fill="${shade(color, .82)}"/><polygon points="${pts(right)}" fill="${color}"/>`;
  }
  const tree = (x, y, s = 1) => `<rect x="${x - 2 * s}" y="${y - 12 * s}" width="${4 * s}" height="${12 * s}" fill="var(--trunk)"/><ellipse cx="${x}" cy="${y + 1}" rx="${9 * s}" ry="${3.5 * s}" fill="var(--shadow)"/>`
    + `<circle cx="${x}" cy="${y - 20 * s}" r="${11 * s}" fill="var(--leaf)"/><circle cx="${x - 3 * s}" cy="${y - 23 * s}" r="${7 * s}" fill="var(--leaf2)"/>`;
  const pine = (x, y, s = 1) => `<ellipse cx="${x}" cy="${y + 1}" rx="${8 * s}" ry="${3 * s}" fill="var(--shadow)"/><path d="M${x},${y - 34 * s} L${x + 10 * s},${y - 10 * s} L${x - 10 * s},${y - 10 * s} Z" fill="var(--leaf2)"/><path d="M${x},${y - 24 * s} L${x + 12 * s},${y} L${x - 12 * s},${y} Z" fill="var(--leaf)"/>`;
  /* ---- libraries: one per zone, each with its own style and a sculpture that says what the zone is about ---- */
  const box = (x, y, wl, wr, h, wall, wall2) => `<polygon points="${pts([[x - wl, y - wl * .5], [x, y], [x, y - h], [x - wl, y - h - wl * .5]])}" fill="${wall2}"/><polygon points="${pts([[x, y], [x + wr, y - wr * .5], [x + wr, y - h - wr * .5], [x, y - h]])}" fill="${wall}"/>`;
  const cube = (x, y, w, h, a = 'var(--wall)', b = 'var(--wall2)') => box(x, y, w, w, h, a, b);
  const topFace = (x, y, wl, wr, h, fill) => { const t = y - h; return `<polygon points="${pts([[x - wl, t - wl * .5], [x, t], [x + wr, t - wr * .5], [x + wr - wl, t - wr * .5 - wl * .5]])}" fill="${fill}"/>`; };
  const rq = (x, y, w, u0, u1, v0, v1, fill) => { const f = (u, v) => [x + w * u, y - w * .5 * u - v]; return `<polygon points="${pts([f(u0, v0), f(u1, v0), f(u1, v1), f(u0, v1)])}" fill="${fill}"/>`; };
  const lq = (x, y, w, u0, u1, v0, v1, fill) => { const f = (u, v) => [x - w * u, y - w * .5 * u - v]; return `<polygon points="${pts([f(u0, v0), f(u1, v0), f(u1, v1), f(u0, v1)])}" fill="${fill}"/>`; };
  const cols = (face, x, y, w, n, v0, v1, fill) => Array.from({ length: n }, (_, i) => face(x, y, w, (i + .3) / n, (i + .62) / n, v0, v1, fill)).join('');
  const cyl = (x, y, r, h, a = 'var(--wall)', b = 'var(--wall2)') => `<path d="M${x - r},${y - h} L${x - r},${y} A${r},${r * .4} 0 0 0 ${x + r},${y} L${x + r},${y - h} Z" fill="${a}"/><path d="M${x - r},${y - h} L${x - r},${y} A${r},${r * .4} 0 0 0 ${x},${y + r * .4} L${x},${y - h} Z" fill="${b}"/>`;
  const line = (x1, y1, x2, y2, c, w = 1.4) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
  const wifiMark = (cx, cy, s, c, sw = 1.6) => [1, 2, 3].map((k) => { const r = s * k * 3.4, d = r * .707; return `<path d="M${cx - d},${cy - d} A${r},${r} 0 0 1 ${cx + d},${cy - d}" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round"/>`; }).join('') + `<circle cx="${cx}" cy="${cy}" r="${1.6 * s}" fill="${c}"/>`;
  const star = (cx, cy, r, c) => `<polygon points="${pts(Array.from({ length: 10 }, (_, i) => { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * .45 : r; return [cx + q * Math.cos(a), cy + q * Math.sin(a)]; }))}" fill="${c}"/>`;
  const gear = (x, y, r, c) => Array.from({ length: 8 }, (_, i) => `<rect x="-1.7" y="${-r - 2.4}" width="3.4" height="4.6" fill="${c}" transform="translate(${x},${y}) rotate(${i * 45})"/>`).join('') + `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/><circle cx="${x}" cy="${y}" r="${r * .42}" fill="var(--top)"/>`;
  const DARK = '#27434a', GLASS = '#7fcbe6', GOLD = '#f2b632';

  const BUILD = {
    /* Wi-Fi: glass pavilion with an access point (disc, antennas, signal arcs) on the roof */
    wifi: (x, y, g) => box(x, y, 19, 19, 20, 'var(--wall)', 'var(--wall2)') + rq(x, y, 19, .1, .9, 5, 16, GLASS) + [1, 2, 3].map((k) => rq(x, y, 19, k * .225 - .012, k * .225 + .012, 5, 16, '#e6f4f8')).join('')
      + lq(x, y, 19, .15, .85, 5, 16, '#5fb4d3') + topFace(x, y, 19, 19, 20, g.rim)
      + `<rect x="${x - 1.3}" y="${y - 39}" width="2.6" height="10" fill="#b9c7cb"/><ellipse cx="${x}" cy="${y - 40}" rx="11" ry="4" fill="#dfe9eb"/><ellipse cx="${x}" cy="${y - 41.5}" rx="10" ry="3.1" fill="#fff"/><circle cx="${x + 5.5}" cy="${y - 40.4}" r="1" fill="#4cd964"/>`
      + line(x - 7, y - 42, x - 10, y - 50, '#cfd8dc', 1.8) + line(x + 7, y - 42, x + 10, y - 50, '#cfd8dc', 1.8) + wifiMark(x, y - 47, .95, '#ffd36b'),
    /* 4G/5G: hall with a lattice base-station mast, sector panels and signal waves */
    mobile: (x, y, g) => {
      const top = y - 16 - 10, h = 46, w0 = 7, w1 = 1.3, wi = (k) => w0 + (w1 - w0) * k;
      let m = '';
      for (let i = 0; i < 5; i++) { const a = i / 5, b = (i + 1) / 5, ya = top - h * a, yb = top - h * b; m += line(x - wi(a), ya, x + wi(b), yb, '#dbe5e8', 1) + line(x + wi(a), ya, x - wi(b), yb, '#dbe5e8', 1); }
      return cube(x, y, 20, 16) + cols(rq, x, y, 20, 4, 0, 14, '#f4f7f6') + rq(x, y, 20, .38, .62, 0, 8, DARK) + topFace(x, y, 20, 20, 16, '#e6dcc3')
        + `<polygon points="${pts([[x - w0, top], [x - w1, top - h], [x + w1, top - h], [x + w0, top]])}" fill="none" stroke="#dbe5e8" stroke-width="1.5"/>` + m
        + `<rect x="${x - 7}" y="${top - h + 3}" width="3.6" height="9" fill="${g.roof}"/><rect x="${x + 3.4}" y="${top - h + 3}" width="3.6" height="9" fill="${g.roof}"/><circle cx="${x}" cy="${top - h - 2}" r="1.8" fill="#ff5a4f"/>`
        + [1, 2].map((k) => `<path d="M${x + 8 + k * 4},${top - h + 2} A${k * 5},${k * 5} 0 0 1 ${x + 8 + k * 4},${top - h + 12}" fill="none" stroke="#ffd36b" stroke-width="1.4" stroke-linecap="round"/><path d="M${x - 8 - k * 4},${top - h + 2} A${k * 5},${k * 5} 0 0 0 ${x - 8 - k * 4},${top - h + 12}" fill="none" stroke="#ffd36b" stroke-width="1.4" stroke-linecap="round"/>`).join('');
    },
    /* CPE: cottage library with a home router (box, two antennas, LEDs) on the ridge */
    cpe: (x, y, g) => cube(x, y, 16, 14) + rq(x, y, 16, .36, .66, 0, 8, '#8a5a3c') + lq(x, y, 16, .3, .7, 5, 10, GLASS) + roof(x, y, 18, 14, 13, g.roof)
      + cube(x, y - 29, 6, 4, '#f4f7f6', '#cfd9dc') + topFace(x, y - 29, 6, 6, 4, '#fff') + line(x - 2.5, y - 36, x - 6, y - 46, '#eef3f4', 1.8) + line(x + 2.5, y - 37, x + 6, y - 47, '#eef3f4', 1.8)
      + `<circle cx="${x + 2.4}" cy="${y - 31.3}" r=".9" fill="#4cd964"/><circle cx="${x + 4.4}" cy="${y - 32}" r=".9" fill="#ffd36b"/>`,
    /* Small cell: rotunda with a pole-mounted small-cell unit (cylinder with a status ring) */
    smallcell: (x, y, g) => cyl(x, y, 16, 16) + [-9, -3, 3, 9].map((d) => `<rect x="${x + d - .8}" y="${y - 15}" width="1.6" height="14" fill="#f4f7f6" opacity=".75"/>`).join('')
      + `<ellipse cx="${x}" cy="${y - 16}" rx="16" ry="6.4" fill="#e6dcc3"/><path d="M${x - 13},${y - 16} A13,13 0 0 1 ${x + 13},${y - 16} Z" fill="${g.roof}"/><path d="M${x},${y - 29} A13,13 0 0 1 ${x + 13},${y - 16} L${x},${y - 16} Z" fill="${shade(g.roof, .8)}"/>`
      + `<rect x="${x - 1}" y="${y - 41}" width="2" height="13" fill="#b9c7cb"/><rect x="${x - 5.5}" y="${y - 55}" width="11" height="15" rx="4" fill="#f4f7f6"/><rect x="${x - 5.5}" y="${y - 50}" width="11" height="2.4" fill="#3fcf8e"/><rect x="${x - 5.5}" y="${y - 45}" width="11" height="1.4" fill="#cfd9dc"/>`
      + [1, 2].map((k) => `<path d="M${x + 7 + k * 3},${y - 52} A${k * 4},${k * 4} 0 0 1 ${x + 7 + k * 3},${y - 44}" fill="none" stroke="#ffd36b" stroke-width="1.3" stroke-linecap="round"/>`).join(''),
    /* Broadband: long arched hall with a fibre cable reel and an orange fibre running to the door */
    broadband: (x0, y, g) => {
      const x = x0 - 6;
      return box(x, y, 12, 28, 14, 'var(--wall)', 'var(--wall2)') + [0, 1, 2, 3].map((i) => rq(x, y, 28, .08 + i * .22, .24 + i * .22, 3, 11, DARK) + rq(x, y, 28, .08 + i * .22, .24 + i * .22, 11, 12.4, '#cfe3e8')).join('')
        + topFace(x, y, 12, 28, 14, g.roof)
        + `<path d="M${x - 14},${y + 10} C${x - 4},${y + 14} ${x + 4},${y + 6} ${x + 10},${y + 1}" fill="none" stroke="#ffb74d" stroke-width="1.6" stroke-linecap="round"/><circle cx="${x + 10}" cy="${y + 1}" r="2" fill="#ffe08a"/>`
        + `<ellipse cx="${x - 22}" cy="${y + 14}" rx="9" ry="3" fill="var(--shadow)"/><circle cx="${x - 22}" cy="${y + 4}" r="10" fill="${g.roof}"/><circle cx="${x - 22}" cy="${y + 4}" r="7.2" fill="${shade(g.roof, .75)}"/><circle cx="${x - 22}" cy="${y + 4}" r="5.2" fill="none" stroke="#ffb74d" stroke-width="1.4"/><circle cx="${x - 22}" cy="${y + 4}" r="3.3" fill="none" stroke="#ffb74d" stroke-width="1.2"/><circle cx="${x - 22}" cy="${y + 4}" r="1.6" fill="#e9f2f3"/>`;
    },
    /* CSIT: stepped test-lab library with a clipboard / checklist statue */
    csit: (x, y, g) => cube(x, y, 18, 14) + rq(x, y, 18, .36, .64, 0, 8, DARK) + cols(lq, x, y, 18, 3, 3, 11, '#f4f7f6') + topFace(x, y, 18, 18, 14, '#e6dcc3')
      + cube(x, y - 18, 10, 9) + rq(x, y - 18, 10, .2, .8, 2, 6, GLASS) + topFace(x, y - 18, 10, 10, 9, g.roof)
      + cube(x - 30, y + 4, 5, 4, '#cfd9dc', '#b5c2c6') + `<rect x="${x - 37}" y="${y - 18}" width="14" height="18" rx="2" fill="#7a5a34"/><rect x="${x - 35.5}" y="${y - 16}" width="11" height="14" fill="#fff"/><rect x="${x - 33}" y="${y - 19.4}" width="6" height="3.4" rx="1" fill="#9aa7ab"/>`
      + `<polyline points="${x - 34},${y - 10} ${x - 32.2},${y - 8} ${x - 29},${y - 13}" fill="none" stroke="#2fb67c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>${line(x - 29, y - 7, x - 26, y - 7, '#b9c7cb', 1.2)}${line(x - 34, y - 5, x - 26, y - 5, '#b9c7cb', 1.2)}`,
    /* Certification: Greek-style temple with a medal and ribbon on the pediment */
    cert: (x, y, g) => cube(x, y, 20, 13) + cols(rq, x, y, 20, 6, 0, 13, '#fbf8ef') + cols(lq, x, y, 20, 4, 0, 13, '#e4ddc8') + topFace(x, y, 20, 20, 13, '#efe6cf')
      + roof(x, y, 21, 13, 9, '#e8dcc0') + `<path d="M${x - 5},${y - 38} L${x - 8},${y - 29} L${x - 3},${y - 31} L${x - 1},${y - 28} Z" fill="#d8403a"/><path d="M${x + 5},${y - 38} L${x + 8},${y - 29} L${x + 3},${y - 31} L${x + 1},${y - 28} Z" fill="#b8312d"/>`
      + `<circle cx="${x}" cy="${y - 41}" r="8" fill="${GOLD}"/><circle cx="${x}" cy="${y - 41}" r="5.8" fill="#ffd66b"/>` + star(x, y - 41, 4.2, '#d08a12'),
    /* Integrations: twin towers linked by a skywalk, with a three-node network on top */
    integrations: (x, y, g) => box(x + 14, y - 3, 9, 9, 26, 'var(--wall)', 'var(--wall2)') + roof(x + 14, y - 3, 9, 26, 8, g.roof) + rq(x + 14, y - 3, 9, .3, .7, 8, 20, GLASS)
      + `<polygon points="${pts([[x - 6, y - 12], [x + 5, y - 17.5], [x + 5, y - 14], [x - 6, y - 8.5]])}" fill="#dbe5e8"/>`
      + box(x - 14, y + 3, 9, 9, 26, 'var(--wall)', 'var(--wall2)') + roof(x - 14, y + 3, 9, 26, 8, g.roof) + rq(x - 14, y + 3, 9, .3, .7, 8, 20, GLASS)
      + line(x - 14, y - 42, x + 14, y - 48, '#9fd8cc', 1.4) + line(x - 14, y - 42, x, y - 56, '#9fd8cc', 1.4) + line(x + 14, y - 48, x, y - 56, '#9fd8cc', 1.4)
      + `<circle cx="${x - 14}" cy="${y - 42}" r="3.6" fill="#ff9d4d"/><circle cx="${x + 14}" cy="${y - 48}" r="3.6" fill="#4aa8ff"/><circle cx="${x}" cy="${y - 56}" r="3.6" fill="#4cd7a0"/>`,
    /* Equipment: industrial hall with a saw-tooth roof, a gear and a booking calendar */
    equipment: (x0, y, g) => {
      const x = x0 - 4;
      return box(x, y, 14, 22, 14, 'var(--wall)', 'var(--wall2)') + rq(x, y, 22, .12, .42, 0, 9, '#8f9fa3') + [0, 1, 2].map((i) => rq(x, y, 22, .52 + i * .15, .62 + i * .15, 4, 10, GLASS)).join('')
        + topFace(x, y, 14, 22, 14, '#cfd9dc') + [.2, .55, .9].map((u) => { const px = x + 22 * u, py = y - 14 - 11 * u; return `<polygon points="${pts([[px - 7, py], [px + 7, py - 9], [px + 7, py]])}" fill="${g.roof}"/>`; }).join('')
        + `<rect x="${x - 3}" y="${y - 44}" width="2.4" height="22" fill="#b9c7cb"/>` + gear(x - 2, y - 46, 7.5, '#ffcf5a')
        + `<rect x="${x - 29}" y="${y - 14}" width="13" height="14" rx="1.5" fill="#fff"/><rect x="${x - 29}" y="${y - 14}" width="13" height="4.4" rx="1.5" fill="#e4503f"/>` + [0, 1, 2].flatMap((r) => [0, 1, 2].map((c) => `<rect x="${x - 27.5 + c * 3.8}" y="${y - 8 + r * 2.8}" width="2.2" height="1.6" fill="#8aa0a5"/>`)).join('');
    },
    /* Lab: observatory-style library (dome with a slit) and a conical flask sculpture */
    lab: (x, y, g) => cube(x, y, 16, 12) + rq(x, y, 16, .36, .64, 0, 8, DARK) + lq(x, y, 16, .25, .75, 4, 9, GLASS) + topFace(x, y, 16, 16, 12, '#e6dcc3')
      + `<ellipse cx="${x}" cy="${y - 20}" rx="14" ry="5.6" fill="var(--wall2)"/><path d="M${x - 14},${y - 20} A14,14 0 0 1 ${x + 14},${y - 20} Z" fill="#e9f1f2"/><path d="M${x},${y - 34} A14,14 0 0 1 ${x + 14},${y - 20} L${x},${y - 20} Z" fill="#cdd9dc"/><path d="M${x + 1},${y - 33.6} L${x + 5},${y - 31} L${x + 5},${y - 21} L${x + 1},${y - 21} Z" fill="${DARK}"/>` + line(x + 3, y - 31, x + 9, y - 39, '#9aa7ab', 3)
      + cube(x + 28, y + 3, 5, 3, '#cfd9dc', '#b5c2c6') + `<path d="M${x + 25},${y - 26} L${x + 31},${y - 26} L${x + 31},${y - 17} L${x + 39},${y - 2} L${x + 17},${y - 2} L${x + 25},${y - 17} Z" fill="rgba(210,242,252,.85)" stroke="#9fd0e0" stroke-width="1"/>`
      + `<path d="M${x + 20},${y - 7} L${x + 36},${y - 7} L${x + 39},${y - 2} L${x + 17},${y - 2} Z" fill="#4cd7a0"/><circle cx="${x + 26}" cy="${y - 11}" r="1.6" fill="#b8f3da"/><circle cx="${x + 31}" cy="${y - 14}" r="1.1" fill="#b8f3da"/>`,
    /* Admin: clock-tower library with a filing cabinet */
    admin: (x, y, g) => cube(x, y, 18, 14) + rq(x, y, 18, .36, .64, 0, 8, DARK) + cols(lq, x, y, 18, 3, 3, 11, '#f4f7f6') + topFace(x, y, 18, 18, 14, '#e6dcc3')
      + box(x, y - 19, 8, 8, 18, 'var(--wall)', 'var(--wall2)') + roof(x, y - 19, 8, 18, 9, g.roof) + `<circle cx="${x + 4}" cy="${y - 33}" r="4.4" fill="#fff" stroke="#8aa0a5" stroke-width=".8"/>${line(x + 4, y - 33, x + 4, y - 36, '#27434a', 1)}${line(x + 4, y - 33, x + 6.4, y - 32, '#27434a', 1)}`
      + box(x + 30, y + 2, 5, 5, 15, '#9db0b6', '#869ba2') + [0, 1, 2].map((i) => rq(x + 30, y + 2, 5, .15, .85, 2 + i * 4.2, 4.6 + i * 4.2, '#c2d0d4')).join('') + [0, 1, 2].map((i) => rq(x + 30, y + 2, 5, .4, .6, 3.2 + i * 4.2, 3.9 + i * 4.2, '#59707a')).join(''),
  };
  const LAYOUT = [
    { b: [-4, -14], t: [[-48, 8, .9], [50, 2, .8]], p: [[54, -14, .8]] }, { b: [4, -16], t: [[-50, 4, 1]], p: [[48, 8, .9], [-40, -12, .7]] },
    { b: [-6, -12], t: [[50, -4, .9], [44, 14, .7]], p: [[-52, 6, .9]] }, { b: [2, -14], t: [[-46, 10, .9]], p: [[50, -6, 1]] },
  ];

  /* ---- one island ---- */
  function island(z, cx, cy, index) {
    const g = z.group, top = hex(1), grass = hex(.84), L = LAYOUT[index % LAYOUT.length];
    const side = (a, b, dy, fill) => `<polygon points="${pts([top[a], top[b], [top[b][0], top[b][1] + dy], [top[a][0], top[a][1] + dy]])}" fill="${fill}"/>`;
    let svg = `<ellipse cx="0" cy="${T + 12}" rx="${R * 1.05}" ry="${R * K * 1.1}" fill="var(--shadow)"/>`;
    svg += side(2, 3, T, 'var(--base)') + side(1, 2, T, 'var(--base2)') + side(0, 1, T, 'var(--base3)');
    svg += side(2, 3, 6, g.rim) + side(1, 2, 6, shade(g.rim, .82)) + side(0, 1, 6, shade(g.rim, .66));
    svg += `<polygon points="${pts(top)}" fill="var(--top)"/><polygon points="${pts(top)}" fill="none" stroke="${g.rim}" stroke-width="2.5" stroke-linejoin="round"/><polygon points="${pts(grass)}" fill="var(--grass)"/>`;
    const things = [{ y: L.b[1], s: `<g transform="translate(${L.b[0]} ${L.b[1]}) scale(.8) translate(${-L.b[0]} ${-L.b[1]})">${BUILD[z.id](L.b[0], L.b[1], g)}</g>` }];
    L.t.forEach(([x, y, s]) => things.push({ y, s: tree(x, y, s) }));
    L.p.forEach(([x, y, s]) => things.push({ y, s: pine(x, y, s) }));
    svg += things.sort((a, b) => a.y - b.y).map((t) => t.s).join('');
    const text = z.short || z.name.replace(' 知識專區', '').replace('知識專區', '').replace('專區', '') || z.name;
    const w = Math.max(70, [...text].reduce((n, c) => n + (c.charCodeAt(0) > 255 ? 14 : 8), 0) + 28);
    const warn = z.stats[3];
    const at = `translate(${cx.toFixed(1)},${cy.toFixed(1)})`;
    const label = `<a class="island tag-layer" href="${esc(z.url)}" data-id="${z.id}" tabindex="0" aria-label="${esc(z.name)}，待處理 ${warn} 項" transform="${at}"><g class="lab" transform="translate(0,27)"><rect x="${-w / 2}" y="-13" width="${w}" height="26" rx="13"/><text y="5">${esc(text)}</text></g>`
      + (warn ? `<g class="badge" transform="translate(${w / 2 - 2},17)"><circle r="9"/><text y="4">${warn}</text></g>` : '')
      + (z.tag === '即時' ? `<circle class="live-dot" cx="${-w / 2 + 2}" cy="27" r="4"/>` : '') + `</a>`;
    GEO[z.id] = { bx: L.b[0], by: L.b[1] };
    const body = `<a class="island" href="${esc(z.url)}" data-id="${z.id}" tabindex="-1" aria-hidden="true" transform="${at}"><g class="lift">${svg}<g class="people" data-island="${z.id}"></g></g></a>`;
    return { body, label };
  }

  /* ---- scene ---- */
  const placed = Object.values(ZONES).map((z) => {
    const [q, r] = z.at;
    return { z, cx: 1.5 * R * q * GAP, cy: Math.sqrt(3) * R * (r + q / 2) * K * GAP };
  }).sort((a, b) => a.cy - b.cy || a.cx - b.cx);
  const minX = Math.min(...placed.map((p) => p.cx)) - R - 40, maxX = Math.max(...placed.map((p) => p.cx)) + R + 40;
  const minY = Math.min(...placed.map((p) => p.cy)) - 80, maxY = Math.max(...placed.map((p) => p.cy)) + T + R * K + 60;
  const scene = document.getElementById('scene');
  scene.setAttribute('viewBox', `${minX} ${minY} ${maxX - minX} ${maxY - minY}`);
  const ripples = [[-.55, .5, 150], [.6, -.35, 190], [.1, 1.05, 130]].map(([fx, fy, rx]) => `<ellipse class="ripple" cx="${minX + (maxX - minX) * (.5 + fx / 2)}" cy="${minY + (maxY - minY) * (.5 + fy / 2)}" rx="${rx}" ry="${rx * .28}"/>`).join('');
  const drawn = placed.map((p, i) => island(p.z, p.cx, p.cy, i));
  scene.innerHTML = ripples + drawn.map((d) => d.body).join('') + drawn.map((d) => d.label).join('');  // labels last, so no island hides another's name

  document.getElementById('legend').innerHTML = GROUPS.map((g) => `<span><i style="background:${g.rim}"></i>${g.label}</span>`).join('');

  /* ---- selection and the side panel ---- */
  const panel = document.getElementById('panel');
  function show(id) {
    const z = ZONES[id];
    document.querySelectorAll('.island').forEach((n) => n.classList.toggle('on', n.dataset.id === id));
    const [cur, hist, week, todo] = z.stats;
    panel.innerHTML = `<div class="eyebrow">${esc(z.group.label)}</div><h2>${esc(z.name)}${z.tag ? `<span class="tag live">${esc(z.tag)}</span>` : '<span class="tag">示範</span>'}</h2><p>${esc(z.tagline)}</p>
      <div class="stats"><div><strong>${cur}</strong><small>目前版本</small></div><div><strong>${hist}</strong><small>歷史版本</small></div><div><strong>${week}</strong><small>本週更新</small></div><div class="warn"><strong>${todo}</strong><small>待處理</small></div></div>
      <p class="latest">最新：${esc(z.latest)}</p><p class="crowd" id="crowd"></p><div class="actions"><a class="btn primary" href="${esc(z.url)}#/overview">進入專區</a><a class="btn" href="${esc(z.url)}#/ai">直接提問</a></div>`;
    if (window.__crowd) window.__crowd(id);
  }
  scene.addEventListener('click', (e) => { const a = e.target.closest('.island'); if (!a) return; e.preventDefault(); show(a.dataset.id); window.__viewerTo && window.__viewerTo(a.dataset.id); });
  scene.addEventListener('dblclick', (e) => { const a = e.target.closest('.island'); if (a) location.assign(a.getAttribute('href') + '#/overview'); });
  scene.addEventListener('keydown', (e) => { const a = e.target.closest('.island'); if (a && e.key === 'Enter') { e.preventDefault(); location.assign(a.getAttribute('href') + '#/overview'); } if (a && e.key === ' ') { e.preventDefault(); show(a.dataset.id); } });
  scene.addEventListener('focusin', (e) => { const a = e.target.closest && e.target.closest('.island'); if (a) show(a.dataset.id); });
  const hot = (e, on) => { const a = e.target.closest && e.target.closest('.island'); if (a) document.querySelectorAll(`.island[data-id="${a.dataset.id}"]`).forEach((n) => n.classList.toggle('hot', on)); };
  scene.addEventListener('mouseover', (e) => hot(e, true));
  scene.addEventListener('mouseout', (e) => hot(e, false));
  show('wifi');

  /* ---- badges and animals (prototype numbers; the real ones come from the server) ----
     Every zone has one badge with 8 levels (a colour each). Its level rises with the points earned by on-topic questions in that zone.
     Each badge level counts 1 towards a "badge level total"; the total unlocks new animals. */
  const TIERS = [
    { n: '灰', c: '#9aa5a8', at: 5 }, { n: '綠', c: '#4cc27a', at: 15 }, { n: '藍', c: '#4aa8ff', at: 35 }, { n: '紫', c: '#a07cf0', at: 70 },
    { n: '紅', c: '#ef5b5b', at: 120 }, { n: '橙', c: '#ff9d3d', at: 200 }, { n: '金', c: '#f2c230', at: 320 }, { n: '彩虹', c: 'url(#rainbow)', at: 500 },
  ];
  const ANIMALS = [
    { id: 'cat', name: '小貓', at: 0, color: '#f4a259' }, { id: 'duck', name: '小鴨', at: 0, color: '#f6d55c' }, { id: 'bunny', name: '兔兔', at: 3, color: '#ece6dc' },
    { id: 'fox', name: '狐狸', at: 6, color: '#e8793a' }, { id: 'bear', name: '小熊', at: 10, color: '#a9744f' }, { id: 'deer', name: '小鹿', at: 15, color: '#c99a6b' },
    { id: 'owl', name: '貓頭鷹', at: 22, color: '#8d7b68' }, { id: 'penguin', name: '企鵝', at: 30, color: '#2f4858' }, { id: 'unicorn', name: '獨角獸', at: 45, color: '#f1e6ff' },

  ];
  const ANIMAL = Object.fromEntries(ANIMALS.map((a) => [a.id, a]));
  const GLYPH = { wifi: '⌁', mobile: '◌', cpe: '◍', smallcell: '◎', broadband: '≋', csit: '◈', cert: '✦', integrations: '⌕', equipment: '▣', lab: '⚗', admin: '▤' };
  const tierOf = (points) => TIERS.filter((t) => points >= t.at).length;
  const levelSum = (scores) => Object.values(scores).reduce((n, p) => n + tierOf(p), 0);
  const unlockedAnimals = (scores) => ANIMALS.filter((a) => levelSum(scores) >= a.at);
  const topTier = (scores) => Math.max(0, ...Object.values(scores).map(tierOf));
  const fakeScores = () => {
    const pool = Object.keys(ZONES).sort(() => Math.random() - .5), scores = {};
    pool.slice(0, 1 + Math.floor(Math.random() * 6)).forEach((id) => { scores[id] = Math.floor(Math.pow(Math.random(), 2.2) * 520); });
    return scores;
  };
  const STORE = 'km-island-proto';
  const loadMine = () => {
    try { const v = JSON.parse(localStorage.getItem(STORE) || 'null'); if (v && v.scores) return v; } catch (_) { /* private mode: use the defaults */ }
    return { scores: { wifi: 38, mobile: 6, cert: 16 }, animal: 'cat' };
  };
  const saveMine = (m) => { try { localStorage.setItem(STORE, JSON.stringify({ scores: m.scores, animal: m.kind })); } catch (_) { /* not saved */ } };
  const badgeSvg = (tier, glyph, size = 30) => `<svg class="bsvg" width="${size}" height="${Math.round(size * 1.08)}" viewBox="0 0 24 26" aria-hidden="true"><path d="M12 1.5 L21.5 5 V12.5 C21.5 18 17.5 22.5 12 24.5 C6.5 22.5 2.5 18 2.5 12.5 V5 Z" fill="${tier ? TIERS[tier - 1].c : 'none'}" stroke="${tier ? 'rgba(0,0,0,.4)' : 'currentColor'}" stroke-width="1" ${tier ? '' : 'stroke-dasharray="2 2" opacity=".5"'}/>`
    + (tier ? `<path d="M12 4 L19 6.6 V12.4 C19 16.6 16 20 12 21.8 C8 20 5 16.6 5 12.4 V6.6 Z" fill="rgba(255,255,255,.2)"/><text x="12" y="15.2" text-anchor="middle" font-size="9" font-weight="700" fill="#fff" stroke="rgba(0,0,0,.35)" stroke-width=".4">${glyph}</text>` : `<text x="12" y="15.2" text-anchor="middle" font-size="9" fill="currentColor" opacity=".5">${glyph}</text>`) + `</svg>`;
  const ringHtml = (u) => { const t = topTier(u.scores); return (t ? `<ellipse cx="0" cy="1" rx="5.8" ry="2.2" fill="none" stroke="${TIERS[t - 1].c}" stroke-width="1.3"/>` : '') + (u.me ? '<ellipse cx="0" cy="1" rx="8" ry="3" fill="none" stroke="var(--accent)" stroke-width="1.2"/>' : ''); };

  /* ---- visitors (prototype: simulated). Each person is a small animal that walks around the island of the zone they are in. ---- */
  const ADJ = ['好奇', '認真', '悠閒', '機靈', '溫柔', '勤勞', '愛問', '開朗', '安靜', '活潑'];
  const nameFor = (kind) => { for (let i = 0; i < 20; i++) { const n = pick(ADJ) + '的' + ANIMAL[kind].name; if (!users.some((u) => u.name === n)) return n; } return pick(ADJ) + '的' + ANIMAL[kind].name + (seq % 90 + 10); };
  const NAMES_UNUSED = ['小狐', '小熊', '小兔', '小貓', '小鴨', '小鹿', '橘貓', '灰熊', '白兔', '黃鴨', '花鹿', '赤狐', '棕熊', '虎斑貓', '雪兔', '小黃鴨'];
  const AVATAR = 1.7;

  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = (list) => list[Math.floor(Math.random() * list.length)];
  const walkArea = hex(.8);
  const inPoly = (x, y, poly) => { let inside = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const [xi, yi] = poly[i], [xj, yj] = poly[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside; } return inside; };
  /* free ground: inside the island, in front of the library (not behind or in it) and above the name label */
  const walkable = (id, x, y) => { const g = GEO[id]; return inPoly(x, y, walkArea) && y > -30 && y < 9 && !(Math.abs(x - g.bx) < 38 && y < g.by + 9); };
  const sample = (id) => { for (let i = 0; i < 60; i++) { const x = rnd(-64, 64), y = rnd(-28, 8); if (walkable(id, x, y)) return { x, y }; } return { x: GEO[id].bx + 44, y: 0 }; };
  const clearPath = (id, a, b) => { for (let k = 1; k <= 8; k++) if (!walkable(id, a.x + (b.x - a.x) * k / 8, a.y + (b.y - a.y) * k / 8)) return false; return true; };

  function figure(u) {
    const k = u.kind, c = u.color, dark = shade(c, .7), light = shade(c, 1.18);
    let ears = '', beak = '', cheek = '', tail = '', behind = '', front = '', eyes = true, feet = dark, belly = light;
    if (k === 'cat' || k === 'fox') ears = [-1, 1].map((s) => `<polygon points="${s * 4},-12 ${s * 2.8},-16.6 ${s * .6},-13.6" fill="${c}"/>`).join('');
    if (k === 'bunny') ears = [-1, 1].map((s) => `<ellipse cx="${s * 2}" cy="-16" rx="1.4" ry="3.6" fill="${c}"/><ellipse cx="${s * 2}" cy="-16" rx=".6" ry="2.4" fill="#f7c6d0"/>`).join('');
    if (k === 'bear') ears = [-1, 1].map((s) => `<circle cx="${s * 3.6}" cy="-13.6" r="1.8" fill="${c}"/>`).join('');

    if (k === 'duck') beak = `<polygon points="4.2,-10.4 7.2,-9.4 4.2,-8.4" fill="#ff9d2e"/><path d="M-1,-14.4 Q0,-17 1.4,-14.6" stroke="${dark}" stroke-width=".9" fill="none"/>`;
    if (k === 'fox') { cheek = `<ellipse cx="0" cy="-8.4" rx="3.2" ry="1.8" fill="#fff7ea"/>`; tail = `<ellipse cx="-5" cy="-4" rx="3" ry="1.8" fill="${c}" transform="rotate(-30 -5 -4)"/><circle cx="-7.6" cy="-5.6" r="1" fill="#fff7ea"/>`; }
    if (k === 'bunny') tail = `<circle cx="-4.3" cy="-3.2" r="1.5" fill="#fff"/>`;
    if (k === 'owl') {
      ears = [-1, 1].map((s) => `<polygon points="${s * 3.8},-13.2 ${s * 2.9},-16.8 ${s * .8},-14.2" fill="${c}"/>`).join('');
      behind = [-1, 1].map((s) => `<ellipse cx="${s * 4.2}" cy="-4.6" rx="1.3" ry="3.4" fill="${dark}"/>`).join('');
      eyes = false;
      front = [-1, 1].map((s) => `<circle cx="${s * 1.9}" cy="-10.3" r="2" fill="#fff"/><circle cx="${s * 1.9}" cy="-10.3" r=".9" fill="#1d3238"/>`).join('') + `<polygon points="-.7,-9 .7,-9 0,-7.6" fill="#ff9d2e"/>`;
      feet = '#ff9d2e';
    }
    if (k === 'penguin') {
      belly = '#f5f7f7'; feet = '#ff9d2e';
      behind = [-1, 1].map((s) => `<ellipse cx="${s * 4.3}" cy="-4.6" rx="1.2" ry="3.2" fill="${dark}" transform="rotate(${s * -12} ${s * 4.3} -4.6)"/>`).join('');
      front = `<ellipse cx="0" cy="-9.6" rx="2.6" ry="2.7" fill="#f5f7f7"/><polygon points="-1,-9.6 1,-9.6 0,-8.2" fill="#ff9d2e"/>`;
      eyes = false; front += [-1, 1].map((s) => `<circle cx="${s * 1.4}" cy="-10.6" r=".75" fill="#1d3238"/>`).join('');
    }
    if (k === 'unicorn') {
      ears = [-1, 1].map((s) => `<ellipse cx="${s * 3.6}" cy="-13.4" rx="1.3" ry="1.6" fill="${c}"/>`).join('') + `<polygon points="-.9,-14 0,-19.6 .9,-14" fill="#f2c230"/><line x1="-.7" y1="-16" x2=".7" y2="-15.4" stroke="#fff3b0" stroke-width=".6"/>`;
      behind = `<ellipse cx="-3.6" cy="-9.4" rx="1.5" ry="3.4" fill="#f7a8d8"/>`;
      tail = `<path d="M-4,-4 Q-8,-6 -7,-1.5" stroke="#f7a8d8" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
    }
    if (k === 'dragon') {
      behind = [-1, 1].map((s) => `<polygon points="${s * 3},-7.4 ${s * 8.6},-12.6 ${s * 5},-3" fill="${shade(c, .78)}"/>`).join('');
      ears = [-1, 1].map((s) => `<polygon points="${s * 2.2},-13.6 ${s * 3.6},-18 ${s * .8},-14.2" fill="#f5e6b3"/>`).join('');
      tail = `<path d="M-4,-3 Q-9,-4 -8.6,-.6" stroke="${c}" stroke-width="2" fill="none" stroke-linecap="round"/><polygon points="-9.6,-1.6 -7.4,-1.6 -8.6,.6" fill="#f5e6b3"/>`;

  const users = [];
  let seq = 0;
  const layer = (id) => scene.querySelector(`.people[data-island="${id}"]`);
  function spawn(island, opts = {}) {

  let last = performance.now(), sortAt = 0;

      else {

          for (let i = 0; i < 8 && !u.target; i++) { const t = sample(u.island); if (clearPath(u.island, u.pos, t)) u.target = t; }

  /* who is where, shown in the corner and in the side panel */
  const ids = Object.keys(ZONES);
  const countEl = document.getElementById('online');
  let selected = 'wifi';
  function count() {

  }

  /* tooltip on hover */
  const tip = document.getElementById('tip');
  scene.addEventListener('mousemove', (e) => {
    const av = e.target.closest && e.target.closest('.av');

  });
  scene.addEventListener('mouseleave', () => { tip.hidden = true; });

  /* simulated comings and goings, as the real page would see them when it polls the server */
  const target = Math.max(0, Math.min(40, Number(new URLSearchParams(location.search).get('users') ?? 11)));
  const weights = ['wifi', 'wifi', 'wifi', 'mobile', 'mobile', 'cpe', 'smallcell', 'broadband', 'csit', 'cert', 'integrations', 'equipment', 'lab', 'admin'];
  const mine = loadMine();
  spawn('wifi', { me: true, name: '你', scores: mine.scores, kind: ANIMAL[mine.animal] ? mine.animal : 'cat' });
  for (let i = 0; i < target - 1; i++) spawn(pick(weights));

  document.getElementById('delUser').addEventListener('click', () => { const o = users.filter((u) => !u.me); if (o.length) leave(pick(o)); });

  const tierName = (t) => `${TIERS[t - 1].n}徽章`;
  function toast(text) { toastEl.textContent = text; toastEl.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastEl.hidden = true; }, 3800); }
  const earned = (scores) => Object.keys(ZONES).filter((id) => tierOf(scores[id] || 0) > 0).sort((a, b) => tierOf(scores[b]) - tierOf(scores[a]));

  function renderMe() {
    const m = meUser(), sc = m.scores, total = levelSum(sc), have = earned(sc).length;
    const rows = GROUPS.flatMap((g) => g.ids).map((id) => {
      const p = sc[id] || 0, t = tierOf(p), next = TIERS[t], prev = t ? TIERS[t - 1].at : 0, pct = next ? Math.round((p - prev) / (next.at - prev) * 100) : 100;
      return `<li class="brow"><span class="bi">${badgeSvg(t, GLYPH[id], 36)}</span><div class="bmain"><div class="bline"><strong>${esc(shortZone(id))}</strong><span>${t ? `${tierName(t)}・Lv.${t}` : '尚未取得徽章'}</span></div>
        <div class="bar"><i style="width:${pct}%;background:${t ? (TIERS[t - 1].c.startsWith('url') ? 'linear-gradient(90deg,#ff5b5b,#ffc83d,#4cd7a0,#4aa8ff,#b57cff)' : TIERS[t - 1].c) : 'var(--accent)'}"></i></div>
        <small>${p} 分${next ? `・再 ${next.at - p} 分升為${tierName(t + 1)}（${next.at} 分）` : '・已達最高等級'}</small></div></li>`;
    }).join('');

    }).join('');

      <p class="sum">已取得 <strong>${have}</strong> 枚徽章・徽章等級合計 <strong>${total}</strong>（每個專區的徽章每升一級計 1）</p>
      <div class="tabs" role="tablist"><button role="tab" data-tab="badges" aria-selected="${meTab === 'badges'}">徽章</button><button role="tab" data-tab="animals" aria-selected="${meTab === 'animals'}">動物</button></div>
      ${meTab === 'badges' ? `<ul class="blist">${rows}</ul>` : `<p class="note">徽章等級合計越高，解鎖越多動物，可以自由選擇要使用哪一隻。</p><ul class="agrid">${animals}</ul>`}

        <button class="btn small" data-add="1">＋1 分（一次符合主題的提問）</button><button class="btn small" data-add="10">＋10 分</button><button class="btn small" data-reset>重設</button></div>`;
  }
  function openMe(tab) { if (tab) meTab = tab; renderMe(); meEl.hidden = false; meEl.querySelector('[data-close]').focus(); }
  function closeMe() { meEl.hidden = true; }
  function refreshMeAvatar() {
    const m = meUser(); if (!m) return;
    m.el.querySelector('.walk').innerHTML = figure(m);
    m.el.querySelector('.fig > g').innerHTML = ringHtml(m);
  }
  function addPoints(zone, n) {
    const m = meUser(), before = m.scores[zone] || 0, t0 = tierOf(before), total0 = levelSum(m.scores);
    m.scores[zone] = before + n; saveMine(m);
    const t1 = tierOf(m.scores[zone]), total1 = levelSum(m.scores), fresh = ANIMALS.filter((a) => a.at > total0 && a.at <= total1);
    const lines = [];
    if (t1 > t0) lines.push(`${shortZone(zone)}專區升為${tierName(t1)}（Lv.${t1}）`);
    if (fresh.length) lines.push(`解鎖新動物：${fresh.map((a) => a.name).join('、')}`);
    if (lines.length) toast(lines.join('　'));
    refreshMeAvatar(); renderMe(); count();
  }
  meEl.addEventListener('click', (e) => {
    if (e.target === meEl || e.target.closest('[data-close]')) return closeMe();
    const tab = e.target.closest('[data-tab]'); if (tab) { meTab = tab.dataset.tab; return renderMe(); }
    const pick = e.target.closest('[data-pick]');
    if (pick) { const m = meUser(); m.kind = pick.dataset.pick; m.color = ANIMAL[m.kind].color; saveMine(m); refreshMeAvatar(); renderMe(); return toast(`現在使用：${ANIMAL[m.kind].name}`); }
    const add = e.target.closest('[data-add]'); if (add) return addPoints(document.getElementById('simZone').value, Number(add.dataset.add));
    if (e.target.closest('[data-reset]')) { const m = meUser(); m.scores = { wifi: 38, mobile: 6, cert: 16 }; m.kind = 'cat'; m.color = ANIMAL.cat.color; saveMine(m); refreshMeAvatar(); renderMe(); }
  });
  document.getElementById('meBtn').addEventListener('click', () => openMe('badges'));

  /* click a person: everything they have earned */
  function openCard(u, x, y) {
    const list = earned(u.scores), total = levelSum(u.scores);
    cardEl.innerHTML = `<button class="x" data-close aria-label="關閉">×</button><div class="chead"><div class="apic">${animalSvg(u.kind, 44)}</div><div><strong>${esc(u.me ? '你' : u.name)}</strong><small>${ANIMAL[u.kind].name}・在${esc(shortZone(u.island))}</small></div></div>
      <p class="csum">${list.length ? `已取得 ${list.length} 枚徽章・徽章等級合計 ${total}` : '還沒有取得徽章'}</p>
      <ul class="clist">${list.map((id) => { const t = tierOf(u.scores[id]); return `<li>${badgeSvg(t, GLYPH[id], 26)}<span>${esc(shortZone(id))}</span><em>${tierName(t)}${u.me ? `・${u.scores[id]} 分` : ''}</em></li>`; }).join('')}</ul>
      ${u.me ? '<button class="btn small" data-open-me>管理我的徽章與動物</button>' : ''}`;
    cardEl.hidden = false;
    const r = cardEl.getBoundingClientRect();
    cardEl.style.left = `${Math.max(8, Math.min(x + 14, innerWidth - r.width - 8))}px`;
    cardEl.style.top = `${Math.max(8, Math.min(y - 20, innerHeight - r.height - 8))}px`;
  }
  scene.addEventListener('click', (e) => {
    const av = e.target.closest && e.target.closest('.av'); if (!av) return;
    e.preventDefault(); e.stopImmediatePropagation();
    const u = users.find((x) => String(x.id) === av.dataset.uid); if (u) openCard(u, e.clientX, e.clientY);
  }, true);
  cardEl.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) cardEl.hidden = true; if (e.target.closest('[data-open-me]')) { cardEl.hidden = true; openMe('badges'); } });
  document.addEventListener('mousedown', (e) => { if (!cardEl.hidden && !cardEl.contains(e.target) && !(e.target.closest && e.target.closest('.av'))) cardEl.hidden = true; });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { cardEl.hidden = true; if (!meEl.hidden) closeMe(); } });

  /* day / night */
  const root = document.documentElement, btn = document.getElementById('theme');
  btn.addEventListener('click', () => { const day = root.dataset.theme !== 'day'; root.dataset.theme = day ? 'day' : ''; btn.textContent = day ? '切換夜間' : '切換日間'; btn.setAttribute('aria-pressed', String(day)); });
})();
</script>
</body>
</html>
