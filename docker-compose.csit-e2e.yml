# Disposable KM-only stack.  It must never reuse the normal compose project,
# Production volumes, CSIT DNS, or CSIT credentials.
services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  report_registry:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: km_reports
      POSTGRES_USER: km_report
      POSTGRES_PASSWORD: km-e2e-report-registry
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U km_report -d km_reports"]
      interval: 3s
      timeout: 3s
      retries: 20

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/km-e2e-neo4j
      NEO4J_PLUGINS: "[]"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p km-e2e-neo4j 'RETURN 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.12.1

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_DB: km_timeseries
      POSTGRES_USER: km_timeseries
      POSTGRES_PASSWORD: km-e2e-timescale
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U km_timeseries -d km_timeseries"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    command: uvicorn src.web_api:app --host 0.0.0.0 --port 8000 --workers 1
    ports:
      - "127.0.0.1:${KM_CSIT_E2E_PORT:?KM_CSIT_E2E_PORT is required}:8000"
    environment: &km_env
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: km-e2e-neo4j
      QDRANT_URL: http://qdrant:6333
      KB_REPORT_REGISTRY_URL: postgresql://km_report:km-e2e-report-registry@report_registry:5432/km_reports
      KB_REPORT_STAGING_ROOT: /e2e/report-staging
      KB_INGEST_UPLOAD_ROOT: /e2e/uploads
      KB_INGEST_REGISTRY_URL: sqlite:////e2e/ingestion-registry.sqlite3
      KM_TIMESERIES_DATABASE_URL: postgresql://km_timeseries:km-e2e-timescale@timescaledb:5432/km_timeseries
      KM_CSIT_NOTIFICATION_ENABLED: "true"
      KM_CSIT_NOTIFICATION_AUTH_TOKEN: ${KM_CSIT_E2E_SENDER_TOKEN:?KM_CSIT_E2E_SENDER_TOKEN is required}
      KM_CSIT_NOTIFICATION_ELIGIBILITY: test-allow
      KM_CSIT_NOTIFICATION_DB: /e2e/receipts.sqlite3
      KM_CSIT_NOTIFICATION_FIXTURES_JSON: ${KM_CSIT_NOTIFICATION_FIXTURES_JSON:?KM_CSIT_NOTIFICATION_FIXTURES_JSON is required}
      KB_REVIEWER_TOKEN_HASHES_JSON: ${KM_CSIT_E2E_REVIEWER_HASH:?KM_CSIT_E2E_REVIEWER_HASH is required}
      KM_E2E_TEST_MODE: "true"
      CSIT_ENABLED: "false"
    volumes:
      - ${KM_CSIT_E2E_ROOT:?KM_CSIT_E2E_ROOT is required}:/e2e
      - ./config/config.e2e.yaml:/app/config/config.yaml:ro
    depends_on:
      redis: {condition: service_healthy}
      report_registry: {condition: service_healthy}
      neo4j: {condition: service_healthy}
      timescaledb: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  ingest_worker:
    build: .
    command: celery -A src.web_api.tasks:celery_app worker --loglevel=info --concurrency=1 -Q ingest
    environment: *km_env
    volumes:
      - ${KM_CSIT_E2E_ROOT:?KM_CSIT_E2E_ROOT is required}:/e2e
      - ./config/config.e2e.yaml:/app/config/config.yaml:ro
    depends_on:
      web: {condition: service_healthy}

  search_worker:
    build: .
    command: celery -A src.web_api.tasks:celery_app worker --loglevel=info --concurrency=1 -Q search
    environment: *km_env
    volumes:
      - ${KM_CSIT_E2E_ROOT:?KM_CSIT_E2E_ROOT is required}:/e2e
      - ./config/config.e2e.yaml:/app/config/config.yaml:ro
    depends_on:
      web: {condition: service_healthy}
