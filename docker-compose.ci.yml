services:
  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports:
      - "127.0.0.1:16333:6333"

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/ci-neo4j-password
      NEO4J_PLUGINS: "[]"
    ports:
      - "127.0.0.1:17688:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ci-neo4j-password 'RETURN 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_DB: km_ci
      POSTGRES_USER: km_ci
      POSTGRES_PASSWORD: ci-timescale-password
    ports:
      - "127.0.0.1:15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U km_ci -d km_ci"]
      interval: 5s
      timeout: 3s
      retries: 20
