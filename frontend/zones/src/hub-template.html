<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06161d">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>CSIT 知識管理系統</title>
  <link rel="stylesheet" href="/zones/{{BASECSS}}">
  <link rel="stylesheet" href="/zones/{{HUBCSS}}">
  <link rel="stylesheet" href="/km-select-dark.fb2dfa66e6a4.css">
</head>
<body>
  <div id="app" class="app-shell" aria-busy="true">
    <aside class="sidebar" aria-label="知識專區導覽">
      <a class="brand" href="/hub/" aria-label="知識中樞首頁">
        <span class="brand-mark" aria-hidden="true">K</span>
        <span><strong>KM</strong><small>research platform</small></span>
      </a>
      <button id="nav-toggle" class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav">開啟功能選單</button>
      <nav id="primary-nav" class="primary-nav"></nav>
      <div class="sidebar-footer">
        <span class="computer-icon" aria-hidden="true"></span>
        <span><strong>KM DEV</strong><small><i></i><span id="zone-status">正在整理各專區資料</span></small></span>
      </div>
    </aside>
    <section class="workspace">
      <header class="topbar">
        <div class="page-title"><h1 id="page-title">CSIT 知識管理系統</h1><p id="page-section">各專區概況與最新動態</p></div>
        <div class="topbar-actions">
          <div class="snapshot-time"><span class="clock-icon" aria-hidden="true"></span><span><strong>資料更新</strong><time id="page-updated">—</time></span></div>
          <button id="refresh-page" class="refresh-button" type="button"><span class="refresh-icon" aria-hidden="true"></span>重新讀取</button>
          <a class="back-link" href="/hub/islands.html">知識島</a>
        </div>
      </header>
      <div class="workspace-body">
        <main id="page-content" tabindex="-1">
          <section class="panel hub-ask" aria-label="全專區知識助理">
            <form id="hub-ask-form" class="hub-ask-form">
              <span class="hub-ask-title">全專區知識助理</span>
              <input id="hub-ask-input" type="text" maxlength="500" autocomplete="off" placeholder="告訴我你想找什麼，我帶你去對的專區，例如：Wi-Fi 認證要準備什麼？" aria-label="告訴導覽助理你想找什麼">
              <button class="primary-button" type="submit">開始查詢</button>
            </form>
            <div class="hub-faq" aria-label="大家最近在問"><div class="hub-faq-head">大家最近在問<small>點一下，帶著問題直接進入專區</small></div><div id="hub-faq-list" class="hub-faq-list"></div></div>
            <div id="hub-ask-panel" class="hub-ask-panel" hidden>
              <div class="hub-ask-bar"><span>我負責帶你到對的專區；專區裡的內容，請到該專區向專家提問</span><span><button id="hub-ask-clear" type="button">清除</button><button id="hub-ask-close" type="button">收合</button></span></div>
              <div id="hub-ask-log" class="hub-ask-log" aria-live="polite"></div>
            </div>
          </section>
          <section class="panel hub-news" aria-label="各專區最新動態">
            <div class="panel-heading"><div><h2>各專區最新動態</h2><span id="hub-news-stamp">讀取中…</span></div><button id="feed-refresh" class="feed-refresh" type="button">重新整理</button></div>
            <div id="hub-news-zones" class="hub-news-zones" role="group" aria-label="依專區篩選"></div>
            <div class="hub-news-cols">
              <div><h3 class="hub-news-title">專區更新消息</h3><div id="hub-news-digest" class="feed-body" aria-live="polite"></div></div>
              <div><h3 class="hub-news-title">文件更新動態</h3><div id="hub-news-docs" class="feed-body" aria-live="polite"></div></div>
            </div>
          </section>
          <div id="hub-body"><div class="loading-card">正在讀取各專區資料…</div></div>
        </main>
      </div>
      <footer class="page-footer"><span>KM Research Platform · KM DEV</span><span>除 WiFi 專區外，其餘專區為示範資料</span></footer>
    </section>
  </div>
  <noscript><p class="noscript">知識中樞需要 JavaScript 才能顯示。</p></noscript>
  <script src="/zones/{{DATA}}" defer></script>
  <script src="/zones/{{HUBJS}}" defer></script>
</body>
</html>
