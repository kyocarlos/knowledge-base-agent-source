<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06161d">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>CSIT 知識管理系統</title>
  <link rel="stylesheet" href="/zones/zone.957774158ba4.css">
  <link rel="stylesheet" href="/zones/hub.49bd8808d438.css">
  <link rel="stylesheet" href="/km-select-dark.fb2dfa66e6a4.css">
  <link rel="stylesheet" href="/km-theme.89b56142d291.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="/km-icons.b72766d351f2.js" defer></script>
  <style>/* this page has no zone list at the left: the islands are the way in */
  .sidebar { display: none; }
  .app-shell { grid-template-columns: minmax(0, 1fr) !important; }</style>
</head>
<body>
  <div id="app" class="app-shell" aria-busy="true">
    <aside class="sidebar" aria-label="知識專區導覽">
      <a class="brand" href="/hub/" aria-label="知識中樞首頁">
        <span class="brand-mark" aria-hidden="true">KM</span>
        <span><strong>KM</strong><small>research platform</small></span>
      </a>
      <button id="nav-toggle" class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav">開啟功能選單</button>
      <nav id="primary-nav" class="primary-nav"></nav>
      <div class="sidebar-footer">
        <span class="computer-icon" aria-hidden="true"></span>
        <span><strong>KM DEV</strong><small><i></i><span id="zone-status">正在整理各專區資料</span></small></span>
      </div>
    </aside>
    <section class="workspace">
      <header class="topbar">
        <div class="page-title"><h1 id="page-title">CSIT 知識管理系統</h1><p id="page-section">各專區概況與最新動態</p></div>
        <div class="topbar-actions">
          <div class="snapshot-time"><span class="clock-icon" aria-hidden="true"></span><span><strong>資料更新</strong><time id="page-updated">—</time></span></div>
          <button id="refresh-page" class="refresh-button" type="button"><span class="refresh-icon" aria-hidden="true"></span>重新讀取</button>
          <a class="back-link" href="/hub/">返回卡片首頁</a>
        </div>
      </header>
      <div class="workspace-body">
        <main id="page-content" tabindex="-1">
          <div id="hub-metrics"></div>
          <section class="panel hub-section hub-unit" aria-label="知識群島">
            <div class="panel-heading"><div><h2>知識群島</h2><span>點島查看摘要，也可以直接問知識島主</span></div></div>
            <div class="hub-unit-body">
              <div id="hub-islands"><div class="loading-card">正在讀取各專區資料…</div></div>
              <div class="hub-keeper" role="region" aria-label="知識島主">
                <p class="hub-keeper-title">知識島主<span>跨所有專區提問，回答會標明資料來自哪個專區</span></p>
                <iframe class="hub-assistant-frame" title="知識島主" src="/chat-v2.html?legacy=1&amp;embed=1&amp;zone=all"></iframe>
              </div>
            </div>
          </section>
          <div id="hub-body"></div>
        </main>
        <aside id="feed-column" class="feed-column" aria-label="跨專區動態"></aside>
      </div>
      <footer class="page-footer"><span>KM Research Platform · KM DEV</span><span>除 WiFi 專區外，其餘專區為示範資料</span></footer>
    </section>
  </div>
  <noscript><p class="noscript">知識中樞需要 JavaScript 才能顯示。</p></noscript>
  <script src="/zones/zones-live.a4fe03eda854.js" defer></script>
  <script src="/zones/hub.c868255c359b.js" defer></script>
</body>
</html>
