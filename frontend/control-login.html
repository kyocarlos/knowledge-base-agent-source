<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KM 帳號服務</title>
<style>body{font-family:system-ui,sans-serif;background:#f2f5f8;margin:0;display:grid;min-height:100vh;place-items:center}.card{background:#fff;padding:2rem;border-radius:12px;width:min(420px,92vw);box-shadow:0 8px 28px #0002}label,input,button{display:block;width:100%;box-sizing:border-box}label{margin:.75rem 0 .25rem}input{padding:.65rem}button{margin-top:1rem;padding:.7rem;background:#075985;color:white;border:0;border-radius:6px}#status{min-height:1.4rem;color:#b91c1c}.hidden{display:none}</style></head>
<body><main class="card"><h1>KM 帳號服務</h1><p id="status">請登入或註冊 KM 帳號。</p><form id="credentials"><label>帳號<input name="username" autocomplete="username" required></label><label>密碼<input name="password" type="password" autocomplete="current-password" minlength="12" required></label><button type="submit">登入</button><button type="button" id="register">註冊</button></form><section id="instances" class="hidden"><h2>選擇資料區</h2><div id="instance-buttons"></div><a id="admin-link" class="hidden" href="/control-admin.html">帳號與授權管理</a><button type="button" id="logout">登出</button></section></main>
<script>
const status=document.querySelector('#status'), form=document.querySelector('#credentials'), instances=document.querySelector('#instances'), buttons=document.querySelector('#instance-buttons'), adminLink=document.querySelector('#admin-link');
async function api(path,opts={}){return fetch('/_control/api/auth'+path,{credentials:'same-origin',headers:{'content-type':'application/json',...(opts.headers||{})},...opts})}
async function selectInstance(instanceId){const r=await api('/select-instance',{method:'POST',body:JSON.stringify({instance_id:instanceId})});if(!r.ok){status.textContent='資料區授權失敗。';return}location.assign((await r.json()).redirect_url)}
function showAccount(account){form.classList.add('hidden');instances.classList.remove('hidden');adminLink.classList.toggle('hidden',!account.is_admin);buttons.replaceChildren(...account.instances.map(item=>{const b=document.createElement('button');b.textContent=item.instance_id.toUpperCase();b.onclick=()=>selectInstance(item.instance_id);return b}));if(account.instances.length===1){status.textContent='正在進入已核准資料區。';selectInstance(account.instances[0].instance_id);return}status.textContent=account.instances.length?'請選擇已核准資料區。':'帳號尚未取得資料區授權。';}
form.onsubmit=async e=>{e.preventDefault();const r=await api('/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(form)))});if(!r.ok){status.textContent='帳號、密碼錯誤，或帳號尚待核准。';return}showAccount(await r.json())};
document.querySelector('#register').onclick=async()=>{const r=await api('/register',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(form)))});status.textContent=r.ok?'註冊完成，請等待系統管理員核准。':'註冊失敗；帳號可能已存在。';};
document.querySelector('#logout').onclick=async()=>{await api('/logout',{method:'POST'});location.reload()};
api('/me').then(async r=>r.ok&&showAccount(await r.json()));
</script></body></html>
