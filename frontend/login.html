<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KM 登入</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#06161d;--mint:#7fffe3;--cyan:#17d9ff;--muted:#8da8ae;--border:rgba(127,255,227,.2)}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body.km-auth{display:grid;place-items:center;overflow-x:hidden;color:#e7ffff;background:linear-gradient(rgba(127,255,227,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(127,255,227,.035) 1px,transparent 1px),radial-gradient(circle at 50% 0%,rgba(0,228,255,.18),transparent 42%),var(--ink);background-size:48px 48px,48px 48px,auto,auto;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.auth-shell{width:min(500px,calc(100vw - 32px));padding:24px}.auth-card{padding:32px;border:1px solid var(--border);border-radius:22px;background:linear-gradient(145deg,rgba(24,78,88,.76),rgba(7,35,43,.9));box-shadow:0 24px 70px rgba(0,0,0,.3)}.brand{display:flex;align-items:center;gap:12px}.brand-mark{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;color:var(--ink);background:linear-gradient(135deg,var(--mint),var(--cyan));font-size:18px;font-weight:900}.brand-name{font-size:14px;font-weight:900;letter-spacing:.24em}.brand-sub,.kicker{color:#617f87;font-size:9px;letter-spacing:.18em;text-transform:uppercase}.kicker{margin-top:34px;color:var(--mint);font-weight:800}.auth-card h1{margin:12px 0 0;color:#f2ffff;font-size:clamp(28px,7vw,40px);letter-spacing:-.05em}.intro{margin:10px 0 24px;color:#9ab2b7;font-size:14px;line-height:1.7}#status{min-height:32px;margin:0 0 14px;padding:8px 10px;border:1px solid rgba(127,255,227,.16);border-radius:10px;color:#b9d6da;background:rgba(0,0,0,.16);font-size:12px;line-height:1.5}.hidden{display:none!important}label{display:block;margin:14px 0 7px;color:#cfe8ea;font-size:11px;font-weight:800;letter-spacing:.08em}input,select{display:block;width:100%;padding:12px 13px;border:1px solid rgba(127,255,227,.2);border-radius:11px;outline:0;color:#f2ffff;background:rgba(0,0,0,.22);font:inherit}input:focus,select:focus{border-color:var(--mint);box-shadow:0 0 0 3px rgba(127,255,227,.12)}button,.outline-link{display:block;width:100%;margin-top:12px;padding:12px 14px;border:1px solid transparent;border-radius:11px;color:var(--ink);background:linear-gradient(90deg,var(--mint),var(--cyan));font:inherit;font-size:12px;font-weight:900;text-align:center;text-decoration:none;cursor:pointer;transition:transform .2s,box-shadow .2s}button:hover,.outline-link:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(23,217,255,.16)}#register{color:var(--mint);border-color:rgba(127,255,227,.28);background:transparent}#oidc-login{margin:16px 0 0}#oidc-login a{display:block;padding:11px;border:1px solid rgba(127,255,227,.28);border-radius:11px;color:var(--mint);font-size:12px;font-weight:800;text-align:center;text-decoration:none}#instances{margin-top:8px}#instances h2{margin:0 0 14px;color:#f2ffff;font-size:18px}.instance-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}#instance-buttons button{min-height:74px;margin:0;border:1px solid var(--border);color:var(--mint);background:rgba(127,255,227,.08);font-size:14px}#instance-buttons button:hover{color:var(--ink);background:linear-gradient(90deg,var(--mint),var(--cyan))}.admin-link{margin-top:18px}.logout{color:var(--muted);border-color:rgba(255,255,255,.14);background:transparent}@media(max-width:520px){.auth-shell{padding:12px}.auth-card{padding:24px 20px}.instance-grid{grid-template-columns:1fr}}
</style></head>
<body class="km-auth"><main class="auth-shell"><section class="auth-card"><div class="brand"><div class="brand-mark">K</div><div><div class="brand-name">KM</div><div class="brand-sub">research intelligence platform</div></div></div><div class="kicker">KM / CONTROL AUTH</div><h1>登入 KM</h1><p class="intro">以受控帳號進入已核准的 KM 資料區，所有入口與查詢都會受到資料區授權保護。</p><p id="status">請登入或註冊 KM 帳號。</p><form id="credentials"><label>帳號<input name="username" autocomplete="username" required></label><label>密碼<input name="password" type="password" autocomplete="current-password" minlength="12" required></label><button type="submit">登入 KM</button><button type="button" id="register">註冊帳號</button></form><p id="oidc-login" class="hidden"><a href="/oidc/login">使用 Shared Identity 登入</a></p><section id="instances" class="hidden"><h2>選擇資料區</h2><div id="instance-buttons" class="instance-grid"></div><a id="admin-link" class="hidden outline-link admin-link" href="/control-admin.html">帳號與授權管理</a><button id="logout" class="logout" type="button">登出</button></section></section></main>
<script>
const status=document.querySelector('#status'),form=document.querySelector('#credentials'),instances=document.querySelector('#instances'),buttons=document.querySelector('#instance-buttons'),adminLink=document.querySelector('#admin-link'),oidcLogin=document.querySelector('#oidc-login');
async function api(path,opts={}){return fetch('/_control/api/auth'+path,{credentials:'same-origin',headers:{'content-type':'application/json',...(opts.headers||{})},...opts})}
const allowedReturnPaths=new Set(['/','/upload','/admin','/admin/chunks','/admin/report-reviews','/skills','/chat-v2.html']);
let referrerPath=null;
try{const referrer=new URL(document.referrer);if(referrer.origin===location.origin)referrerPath=referrer.pathname}catch(_){ }
const requestedReturnPath=new URLSearchParams(location.search).get('next')||referrerPath;
const returnPath=allowedReturnPaths.has(requestedReturnPath)?requestedReturnPath:'/chat-v2.html';
function showAccount(account){form.classList.add('hidden');instances.classList.remove('hidden');adminLink.classList.toggle('hidden',!account.is_admin);buttons.replaceChildren(...account.instances.map(item=>{const b=document.createElement('button');b.textContent=item.instance_id.toUpperCase();b.onclick=async()=>{const r=await api('/select-instance?return_to='+encodeURIComponent(returnPath),{method:'POST',body:JSON.stringify({instance_id:item.instance_id})});if(!r.ok){status.textContent='資料區授權失敗。';return}location.assign((await r.json()).redirect_url)};return b}));status.textContent=account.instances.length?'請選擇已核准資料區。':'帳號尚未取得資料區授權。';}
form.onsubmit=async e=>{e.preventDefault();const r=await api('/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(form)))});if(!r.ok){status.textContent='帳號、密碼錯誤，或帳號尚待核准。';return}showAccount(await r.json())};
document.querySelector('#register').onclick=async()=>{const r=await api('/register',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(form)))});status.textContent=r.ok?'註冊完成，請等待系統管理員核准。':'註冊失敗；帳號可能已存在。';};
document.querySelector('#logout').onclick=async()=>{await api('/logout',{method:'POST'});location.reload()};
fetch('/oidc/availability',{credentials:'same-origin'}).then(r=>r.ok?r.json():{enabled:false}).then(v=>oidcLogin.classList.toggle('hidden',v.enabled!==true)).catch(()=>{});
api('/me').then(async r=>r.ok&&showAccount(await r.json()));
</script></body></html>
