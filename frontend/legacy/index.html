<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06161d">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>舊資料專區瀏覽</title>
  <style>
    :root{--bg:#06161d;--panel:#0b2630;--panel2:#0f3340;--line:rgba(127,255,227,.22);--text:#d7eef0;--dim:#8fb4ba;--accent:#7fffe3;--warn:#ffd9a8;--bad:#ff9d9d}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 "Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}
    a{color:var(--accent)}
    header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
    header h1{margin:0;font-size:18px}
    header small{color:var(--dim)}
    header .nav{margin-left:auto}
    #zones{display:flex;flex-wrap:wrap;gap:8px;padding:12px 20px;border-bottom:1px solid var(--line)}
    #zones button{background:rgba(127,255,227,.06);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:13px}
    #zones button[aria-pressed="true"]{background:rgba(127,255,227,.2);border-color:var(--accent)}
    #zones button .n{margin-left:6px;color:var(--dim);font-size:12px}
    main{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;padding:16px 20px}
    @media(max-width:860px){main{grid-template-columns:1fr}}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
    .panel h2{margin:0 0 8px;font-size:14px;color:var(--accent)}
    #tree{max-height:70vh;overflow:auto}
    #tree .l1{font-weight:600;margin-top:8px}
    #tree .l2{margin-left:12px;color:#bfe0e3}
    #tree .l3{margin-left:24px;color:var(--dim)}
    #tree button{all:unset;cursor:pointer;display:block;width:100%;padding:2px 4px;border-radius:4px}
    #tree button:hover,#tree button.on{background:rgba(127,255,227,.15)}
    #tree .n{float:right;color:var(--dim);font-size:12px}
    .ask{display:flex;gap:8px;margin-bottom:10px}
    .ask input[type=text]{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 12px;font-size:14px}
    button.go{background:rgba(127,255,227,.2);border:1px solid var(--accent);color:var(--text);border-radius:8px;padding:8px 16px;cursor:pointer}
    button.go:disabled{opacity:.5;cursor:wait}
    .scope{color:var(--dim);font-size:12px;margin:0 0 8px}
    #answer .text{white-space:pre-wrap}
    #answer .cite{margin:6px 0;padding:6px 8px;border-left:3px solid var(--accent);background:rgba(127,255,227,.05)}
    #answer .cite b{color:var(--accent)}
    #answer .cite small{display:block;color:var(--dim);word-break:break-all}
    .none{color:var(--warn)}
    .err{color:var(--bad)}
    .row{padding:9px 4px;border-bottom:1px solid rgba(127,255,227,.1);cursor:pointer}
    .row:hover{background:rgba(127,255,227,.06)}
    .row .t{font-weight:600}
    .row .m{color:var(--dim);font-size:12px;word-break:break-all}
    .row .s{color:#bfe0e3;font-size:13px}
    .badge{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:999px;padding:0 8px;margin-left:6px;color:var(--dim)}
    .badge.warn{color:var(--warn);border-color:var(--warn)}
    .bar{display:flex;gap:8px;align-items:center;margin-bottom:6px}
    .bar input{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px}
    .pager{display:flex;gap:10px;align-items:center;margin-top:8px;color:var(--dim)}
    .pager button{background:none;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:3px 10px;cursor:pointer}
    .pager button:disabled{opacity:.4;cursor:default}
    #detail{position:fixed;inset:0 0 0 auto;width:min(640px,100%);background:var(--panel);border-left:1px solid var(--accent);padding:16px 18px;overflow:auto;transform:translateX(100%);transition:transform .18s}
    #detail.open{transform:none}
    #detail h3{margin:0 24px 6px 0}
    #detail .x{position:absolute;right:14px;top:10px;background:none;border:0;color:var(--text);font-size:22px;cursor:pointer}
    #detail dl{display:grid;grid-template-columns:90px 1fr;gap:4px 10px;margin:8px 0}
    #detail dt{color:var(--dim)}
    #detail dd{margin:0;word-break:break-all}
    #detail .chunk{border-top:1px dashed var(--line);padding:8px 0;white-space:pre-wrap}
    #detail .chunk i{color:var(--dim);font-style:normal;font-size:12px;display:block}
    .chips span{display:inline-block;margin:2px 4px 2px 0;padding:0 8px;border:1px solid var(--line);border-radius:999px;font-size:12px}
  </style>
  <link rel="stylesheet" href="/km-theme.a56758f45f60.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="/km-icons.5decf0d94da3.js" defer></script>
</head>
<body>
  <header>
    <h1>舊資料專區瀏覽</h1><small>NAS 匯入的舊文件，依主題專區與分類瀏覽、檢索、提問</small>
    <span class="nav"><a href="/hub/">回知識中樞</a></span>
  </header>
  <div id="zones" role="tablist" aria-label="主題專區"></div>
  <main>
    <aside class="panel"><h2>分類</h2><div id="tree">載入中…</div></aside>
    <section>
      <div class="panel" style="margin-bottom:16px">
        <h2>向這個專區提問</h2>
        <p class="scope" id="scope"></p>
        <form class="ask" id="askForm">
          <input type="text" id="question" maxlength="500" placeholder="例如：這個專區有哪些關於認證流程的文件？" aria-label="問題" autocomplete="off">
          <button class="go" id="askBtn" type="submit">提問</button>
        </form>
        <div id="answer" aria-live="polite"></div>
      </div>
      <div class="panel">
        <h2>文件列表 <span id="count" class="badge"></span></h2>
        <div class="bar"><input type="search" id="filter" placeholder="依標題或原始路徑篩選" aria-label="篩選文件"></div>
        <div id="list"></div>
        <div class="pager"><button id="prev">上一頁</button><span id="page"></span><button id="next">下一頁</button></div>
      </div>
    </section>
  </main>
  <aside id="detail" aria-label="文件詳情"><button class="x" id="closeDetail" aria-label="關閉">×</button><div id="detailBody"></div></aside>
<script>
(() => {
  const PAGE = 30;
  const state = { zone: null, zones: [], l1: null, l2: null, l3: null, q: '', skip: 0, total: 0 };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  async function api(path, body) {
    const init = { credentials: 'same-origin', headers: { Accept: 'application/json' } };
    if (body) { init.method = 'POST'; init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(body); }
    const r = await fetch(path, init);
    if (r.status === 401) { location.href = '/login.html'; throw new Error('請先登入'); }
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.detail || `錯誤 ${r.status}`);
    return data;
  }
  const scopeText = () => [state.l1, state.l2, state.l3].filter(Boolean).join(' / ');

  function renderZones() {
    $('zones').innerHTML = state.zones.map((z) =>
      `<button role="tab" data-key="${esc(z.key)}" aria-pressed="${z.key === state.zone}">${esc(z.name)}<span class="n">${z.documents}</span></button>`).join('');
  }
  async function loadTree() {
    const zone = state.zones.find((z) => z.key === state.zone);
    const { categories } = await api('/api/legacy/categories?zone=' + encodeURIComponent(state.zone));
    const rows = [`<button data-l="" class="${scopeText() ? '' : 'on'}">全部文件<span class="n">${zone ? zone.documents : ''}</span></button>`];
    let l1 = null, l2 = null;
    for (const c of categories) {
      if (c.l1 !== l1) { l1 = c.l1; l2 = null; rows.push(`<div class="l1">${esc(c.l1)}</div>`); }
      if (c.l2 && c.l2 !== l2) { l2 = c.l2; rows.push(`<div class="l2">${esc(c.l2)}</div>`); }
      const label = c.l3 || c.l2 || c.l1;
      const on = state.l1 === c.l1 && (state.l2 || '') === (c.l2 || '') && (state.l3 || '') === (c.l3 || '');
      rows.push(`<div class="${c.l3 ? 'l3' : 'l2'}"><button data-l1="${esc(c.l1)}" data-l2="${esc(c.l2)}" data-l3="${esc(c.l3)}" class="${on ? 'on' : ''}">${esc(label)}<span class="n">${c.documents}</span></button></div>`);
    }
    $('tree').innerHTML = rows.join('') || '這個專區沒有資料';
  }
  async function loadList() {
    const p = new URLSearchParams({ zone: state.zone, skip: state.skip, limit: PAGE });
    for (const k of ['l1', 'l2', 'l3', 'q']) if (state[k]) p.set(k, state[k]);
    $('list').textContent = '載入中…';
    try {
      const { total, items } = await api('/api/legacy/documents?' + p);
      state.total = total;
      $('count').textContent = `${total} 份`;
      $('list').innerHTML = items.map((d) => `<div class="row" data-id="${esc(d.document_id)}">
        <div class="t">${esc(d.title)}<span class="badge">${esc(d.document_type)}</span>${d.needs_review ? '<span class="badge warn">待審</span>' : ''}</div>
        <div class="s">${esc((d.summary || '').slice(0, 140))}</div>
        <div class="m">${esc((d.source_paths || [])[0] || '')}${(d.source_paths || []).length > 1 ? ` （另有 ${(d.source_paths.length - 1)} 個相同檔案）` : ''}</div></div>`).join('')
        || '<div class="none">沒有符合的文件</div>';
      const pages = Math.max(1, Math.ceil(total / PAGE));
      $('page').textContent = `第 ${Math.floor(state.skip / PAGE) + 1} / ${pages} 頁`;
      $('prev').disabled = state.skip === 0;
      $('next').disabled = state.skip + PAGE >= total;
    } catch (e) { $('list').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  }
  async function selectZone(key) {
    state.zone = key; state.l1 = state.l2 = state.l3 = null; state.q = ''; state.skip = 0; $('filter').value = ''; $('answer').innerHTML = '';
    history.replaceState(null, '', '?zone=' + encodeURIComponent(key));
    renderZones(); updateScope();
    await Promise.all([loadTree(), loadList()]);
  }
  function updateScope() {
    const z = state.zones.find((x) => x.key === state.zone);
    $('scope').textContent = `範圍：${z ? z.name : ''}${scopeText() ? '／' + scopeText() : ''}（只會根據這個範圍內的資料回答）`;
  }

  $('zones').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) selectZone(b.dataset.key); });
  $('tree').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    state.l1 = b.dataset.l1 || null; state.l2 = b.dataset.l2 || null; state.l3 = b.dataset.l3 || null; state.skip = 0;
    updateScope(); loadTree(); loadList();
  });
  let timer;
  $('filter').addEventListener('input', (e) => { clearTimeout(timer); timer = setTimeout(() => { state.q = e.target.value.trim(); state.skip = 0; loadList(); }, 300); });
  $('prev').onclick = () => { state.skip = Math.max(0, state.skip - PAGE); loadList(); };
  $('next').onclick = () => { state.skip += PAGE; loadList(); };

  $('askForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const query = $('question').value.trim(); if (!query) return;
    $('askBtn').disabled = true; $('answer').innerHTML = '<span class="none">檢索並整理答案中…</span>';
    try {
      const out = await api('/api/legacy/answer', { query, zone: state.zone, l1: state.l1, l2: state.l2, l3: state.l3, top_k: 6 });
      const cites = out.citations.map((c) => `<div class="cite"><b>[${esc(c.ref)}]</b> <a href="#" data-doc="${esc(c.document_id)}">${esc(c.title)}</a>
        <small>${esc(c.category)}　${esc(c.source_path)}</small><small>${esc(c.excerpt)}</small></div>`).join('');
      $('answer').innerHTML = `<div class="text ${out.grounded ? '' : 'none'}">${esc(out.answer)}</div>${cites ? '<h2 style="margin-top:10px">引用來源</h2>' + cites : ''}`;
    } catch (err) { $('answer').innerHTML = `<div class="err">${esc(err.message)}</div>`; }
    $('askBtn').disabled = false;
  });
  $('answer').addEventListener('click', (e) => { const a = e.target.closest('a[data-doc]'); if (a) { e.preventDefault(); openDoc(a.dataset.doc); } });
  $('list').addEventListener('click', (e) => { const r = e.target.closest('.row'); if (r) openDoc(r.dataset.id); });

  async function openDoc(id) {
    $('detail').classList.add('open'); $('detailBody').textContent = '載入中…';
    try {
      const d = await api('/api/legacy/documents/' + encodeURIComponent(id));
      const ents = (d.entities || []).map((x) => `<span title="${esc(x.kind)}">${esc(x.name)}</span>`).join('');
      $('detailBody').innerHTML = `<h3>${esc(d.title)}</h3>
        <dl><dt>專區</dt><dd>${esc(d.topic_zone)}</dd><dt>分類</dt><dd>${esc([d.l1, d.l2, d.l3].filter(Boolean).join(' / '))}</dd>
        <dt>類型</dt><dd>${esc(d.document_type)}</dd><dt>日期</dt><dd>${esc(d.document_date || '—')}</dd>
        <dt>分類信心</dt><dd>${d.classification_confidence ?? '—'}${d.needs_review ? '（待審）' : ''}</dd>
        <dt>原始路徑</dt><dd>${(d.source_paths || []).map(esc).join('<br>')}</dd><dt>匯入批次</dt><dd>${esc(d.import_batch)}</dd></dl>
        <p>${esc(d.summary || '')}</p>${ents ? '<h2>文件中的實體</h2><div class="chips">' + ents + '</div>' : ''}
        <h2 style="margin-top:12px">內文片段（${(d.chunks || []).length}）</h2>
        ${(d.chunks || []).map((c) => `<div class="chunk"><i>片段 ${c.chunk_index}</i>${esc(c.text)}</div>`).join('')}`;
    } catch (err) { $('detailBody').innerHTML = `<div class="err">${esc(err.message)}</div>`; }
  }
  $('closeDetail').onclick = () => $('detail').classList.remove('open');
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('detail').classList.remove('open'); });

  (async () => {
    try {
      state.zones = (await api('/api/legacy/zones')).zones;
      const wanted = new URLSearchParams(location.search).get('zone');
      await selectZone(state.zones.some((z) => z.key === wanted) ? wanted : (state.zones.find((z) => z.documents) || state.zones[0]).key);
    } catch (e) { $('tree').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  })();
})();
</script>
</body>
</html>
