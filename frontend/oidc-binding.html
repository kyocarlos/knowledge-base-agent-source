<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>KM 帳號綁定申請</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0%,#153f4c,transparent 50%),#06161d;color:#e7ffff;font-family:system-ui,sans-serif;line-height:1.7}main{width:min(600px,calc(100vw - 32px));margin:32px 0;padding:32px;border:1px solid #315d62;border-radius:20px;background:#0b2933}h1{font-size:28px;margin:8px 0 20px}.brand{color:#7fffe3;font-weight:800;letter-spacing:.16em}.status{border:1px solid #315d62;border-radius:12px;padding:16px;background:#061d25}dl{display:grid;grid-template-columns:110px 1fr;gap:8px;margin:20px 0}dt{color:#8da8ae}dd{margin:0;overflow-wrap:anywhere}.hidden{display:none}button,a{display:inline-block;margin:10px 10px 0 0;padding:10px 14px;border:1px solid #7fffe3;border-radius:10px;background:#102f39;color:#7fffe3;font:inherit;text-decoration:none;cursor:pointer}.note{color:#a9c2c7;font-size:14px}button:disabled{opacity:.6;cursor:wait}</style></head>
<body><main><div class="brand">KM / SHARED IDENTITY</div><h1>KM 帳號綁定申請</h1><p id="message" class="status" role="status" aria-live="polite">正在讀取申請狀態…</p><dl id="details" class="hidden"><dt>顯示名稱</dt><dd id="name"></dd><dt>帳號／Email</dt><dd id="account"></dd><dt>申請狀態</dt><dd id="state"></dd><dt>申請時間</dt><dd id="time"></dd><dt>申請參考</dt><dd id="reference"></dd></dl><p id="reason" class="note hidden"></p><p class="note">KM 帳號與資料區權限由 KM 管理員核准及管理。</p><button id="refresh" type="button">重新整理狀態</button><a href="/oidc/login">再次進入 KM</a></main>
<script>
const message=document.querySelector('#message'),details=document.querySelector('#details'),refresh=document.querySelector('#refresh');
const labels={pending:'等待管理員核准',approved:'已核准',rejected:'已拒絕'};
async function load(){refresh.disabled=true;try{const r=await fetch('/_control/api/auth/oidc/binding',{credentials:'same-origin',cache:'no-store'});if(!r.ok){details.classList.add('hidden');message.textContent=r.status===401?'申請狀態工作階段已過期，請由 Shared Identity 再次進入 KM。':'目前無法讀取申請狀態，請稍後重試。';return}const v=await r.json();message.textContent=v.status==='approved'?'您的 KM 帳號綁定已核准。請按「再次進入 KM」繼續。':v.status==='rejected'?'您的 KM 帳號綁定申請已被拒絕，請聯絡 KM 管理員。':'您的 Shared Identity 已驗證成功，目前尚未綁定 KM 帳號。已送出帳號綁定申請，請等待 KM 管理員核准。';document.querySelector('#name').textContent=v.profile.name||'—';document.querySelector('#account').textContent=[v.profile.account,v.profile.email].filter(Boolean).join(' / ')||'—';document.querySelector('#state').textContent=labels[v.status]||v.status;document.querySelector('#time').textContent=new Date(v.requested_at*1000).toLocaleString();document.querySelector('#reference').textContent=v.binding_request_id.slice(0,8);const reason=document.querySelector('#reason');reason.textContent=v.reject_reason?'拒絕原因：'+v.reject_reason:'';reason.classList.toggle('hidden',!v.reject_reason);details.classList.remove('hidden')}catch(_){message.textContent='目前無法連線，請稍後重新整理。'}finally{refresh.disabled=false}}
refresh.onclick=load;load();
</script></body></html>
