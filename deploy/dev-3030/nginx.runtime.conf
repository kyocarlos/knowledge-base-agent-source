events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  resolver 127.0.0.11 valid=5s ipv6=off;

  map $request_uri $km_login_next {
    default /chat-v2.html;
    ~^/$ /;
    ~^/upload(?:\?.*)?$ /upload;
    ~^/admin(?:\?.*)?$ /admin;
    ~^/admin/chunks(?:\?.*)?$ /admin/chunks;
    ~^/admin/report-reviews(?:\?.*)?$ /admin/report-reviews;
    ~^/skills(?:\?.*)?$ /skills;
    ~^/chat-v2\.html(?:\?.*)?$ /chat-v2.html;
  }

  map $cookie_km_instance_route $web_upstream {
    default kb-web:8000;
    test kb-web:8000;
    da40 km-da40-web-1:8000;
  }

  # KM DEV UPLOAD BEGIN MAP
  map $cookie_km_instance_route $km_dev_upload_upstream {
    default "";
    da40 km-dev-upload-da40:8000;
    test km-dev-upload-test:8000;
  }
  # KM DEV UPLOAD END MAP

  server {
    listen 443 ssl http2;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 200m;
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Control Auth is independent from the Test data plane and has no host port.
    # CSIT v1 service-only boundary. Human cookies are never integration auth.
    # KM DEV UPLOAD BEGIN ROUTES
    location = /dev-upload.html {
      if ($km_dev_upload_upstream = "") { return 302 https://$host:3030/login.html?next=/chat-v2.html; }
      proxy_intercept_errors on;
      error_page 401 = @dev_upload_login;
      access_log off;
      error_log /dev/null crit;
      proxy_pass http://$km_dev_upload_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location @dev_upload_login {
      return 302 https://$host:3030/login.html?next=/chat-v2.html;
    }
    location ^~ /api/dev-upload/ {
      if ($km_dev_upload_upstream = "") { return 404; }
      client_max_body_size 20m;
      access_log off;
      error_log /dev/null crit;
      proxy_pass http://$km_dev_upload_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /da40/api/dev-upload/ {
      client_max_body_size 20m;
      access_log off;
      error_log /dev/null crit;
      proxy_pass http://km-dev-upload-da40:8000/api/dev-upload/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /test/api/dev-upload/ {
      client_max_body_size 20m;
      access_log off;
      error_log /dev/null crit;
      proxy_pass http://km-dev-upload-test:8000/api/dev-upload/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    # KM DEV UPLOAD END ROUTES

    location = /api/integrations/csit/v1/ingestion-jobs {
      client_max_body_size 64k;
      access_log off;
      error_log /dev/null crit;
      proxy_pass http://km-csit-integration-api:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /_control/api/ {
      proxy_pass http://km-control-auth:8000/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Public OIDC endpoints are served by Control Auth and remain fail-closed
    # until Shared Identity client settings are provisioned.
    location ^~ /oidc/ {
      access_log off;
      error_log /dev/null crit;
      proxy_pass http://km-control-auth:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /signed-out {
      proxy_pass http://km-control-auth:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Phase 1 uses client_secret_basic; no client public-JWKS consumer exists.
    # Keep an explicit denial so this path cannot fall through to the SPA.
    location = /.well-known/km-oidc-client-jwks.json {
      add_header Cache-Control "no-store" always;
      return 404;
    }
    location = /oidc/binding.html {
      access_log off;
      error_log /dev/null crit;
      try_files /oidc-binding.html =404;
      add_header Cache-Control "no-store" always;
    }
    # KM DEV CHAT SEARCH BEGIN
    location ~ ^/(chat|chat-v2)\.html$ {
      auth_request /_km_session_check;
      error_page 401 = @login;
      sub_filter '</body>' '<script src="/dev-chat-bridge.js" defer></script></body>';
      sub_filter_once on;
      add_header Cache-Control "no-store" always;
      try_files $uri =404;
    }
    location = /dev-chat-bridge.js {
      if ($km_dev_upload_upstream = "") { return 204; }
      access_log off;
      error_log /dev/null crit;
      proxy_pass http://$km_dev_upload_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    # KM DEV CHAT SEARCH END

    location = /login.html { try_files /login.html =404; add_header Cache-Control "no-store" always; }
    location = /control-admin.html { try_files /control-admin.html =404; add_header Cache-Control "no-store" always; }
    location = /source-credentials.html { try_files /source-credentials.html =404; add_header Cache-Control "no-store" always; }
    location = /health { proxy_pass http://$web_upstream; proxy_http_version 1.1; }

    # UI routes are checked here, while every direct API/WS request is checked
    # again by the Test application middleware.
    location = /_km_session_check {
      internal;
      proxy_pass http://$web_upstream/api/auth/me;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
    }
    location @login { return 302 https://$host:3030/login.html?next=$km_login_next; }
    # Data-plane login-url must point to the login page on the current host,
    # the same page @login uses; the data planes' configured control origin and
    # control-login.html do not exist on this ingress.
    location = /api/auth/login-url {
      default_type application/json;
      add_header Cache-Control "no-store" always;
      return 200 '{"login_url":"https://$host:3030/login.html"}';
    }
    location = /da40/api/auth/login-url {
      default_type application/json;
      add_header Cache-Control "no-store" always;
      return 200 '{"login_url":"https://$host:3030/login.html"}';
    }

    # Instance-specific one-time callbacks. The callback code is consumed by
    # the target data plane; the route cookie only selects the upstream and
    # cannot grant access by itself because each web validates its own token.
    location ^~ /da40/api/ {
      proxy_pass http://km-da40-web-1:8000/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      add_header Set-Cookie "km_instance_route=da40; Path=/; HttpOnly; Secure; SameSite=Strict; Max-Age=900" always;
    }
    location = /api/auth/callback {
      proxy_pass http://kb-web:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      add_header Set-Cookie "km_instance_route=test; Path=/; HttpOnly; Secure; SameSite=Strict; Max-Age=900" always;
    }

    location /api/ { proxy_pass http://$web_upstream; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /search { proxy_pass http://$web_upstream; proxy_http_version 1.1; }
    location ^~ /tasks/ { proxy_pass http://$web_upstream; proxy_http_version 1.1; }
    location = /stats { proxy_pass http://$web_upstream; proxy_http_version 1.1; }
    location = /hybrid-status { proxy_pass http://$web_upstream; proxy_http_version 1.1; }
    location = /files { proxy_pass http://$web_upstream; proxy_http_version 1.1; }
    location = /category-relevance { proxy_pass http://$web_upstream; proxy_http_version 1.1; }
    location = /analyze-question { proxy_pass http://$web_upstream; proxy_http_version 1.1; }
    location /ws {
      proxy_pass http://$web_upstream/ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
    location / {
      auth_request /_km_session_check;
      error_page 401 = @login;
      try_files $uri $uri/ /index.html;
    }
  }
}
