# LLM primary for the TEST plane (2026-10-15): OpenAI-compatible model through
# Sub2API, Ollama as fallback (see src/web_api/ollama_client.py). The API key
# is read from a 0600 env file outside git; this file holds no secrets.
services:
  web:
    env_file: [/home/da40_ai_gb10/.km-control/llm/sub2api-km.env]
    environment:
      KM_LLM_PRIMARY_PROVIDER: ${KM_LLM_PRIMARY_PROVIDER:-sub2api}
      KM_LLM_PRIMARY_MODEL: ${KM_LLM_PRIMARY_MODEL:-gpt-5.6-luna}
      KM_LLM_PRIMARY_BASE_URL: ${KM_LLM_PRIMARY_BASE_URL:-http://host.docker.internal:18080/v1}
      KM_LLM_PRIMARY_API_KEY_ENV: KM_SUB2API_API_KEY
      KM_LLM_PRIMARY_TIMEOUT_SECONDS: ${KM_LLM_PRIMARY_TIMEOUT_SECONDS:-60}
  celery_search_worker:
    env_file: [/home/da40_ai_gb10/.km-control/llm/sub2api-km.env]
    environment:
      KM_LLM_PRIMARY_PROVIDER: ${KM_LLM_PRIMARY_PROVIDER:-sub2api}
      KM_LLM_PRIMARY_MODEL: ${KM_LLM_PRIMARY_MODEL:-gpt-5.6-luna}
      KM_LLM_PRIMARY_BASE_URL: ${KM_LLM_PRIMARY_BASE_URL:-http://host.docker.internal:18080/v1}
      KM_LLM_PRIMARY_API_KEY_ENV: KM_SUB2API_API_KEY
      KM_LLM_PRIMARY_TIMEOUT_SECONDS: ${KM_LLM_PRIMARY_TIMEOUT_SECONDS:-60}
  celery_ingest_worker:
    env_file: [/home/da40_ai_gb10/.km-control/llm/sub2api-km.env]
    environment:
      KM_LLM_PRIMARY_PROVIDER: ${KM_LLM_PRIMARY_PROVIDER:-sub2api}
      KM_LLM_PRIMARY_MODEL: ${KM_LLM_PRIMARY_MODEL:-gpt-5.6-luna}
      KM_LLM_PRIMARY_BASE_URL: ${KM_LLM_PRIMARY_BASE_URL:-http://host.docker.internal:18080/v1}
      KM_LLM_PRIMARY_API_KEY_ENV: KM_SUB2API_API_KEY
      KM_LLM_PRIMARY_TIMEOUT_SECONDS: ${KM_LLM_PRIMARY_TIMEOUT_SECONDS:-60}
