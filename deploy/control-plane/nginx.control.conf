server {
  listen 443 ssl;
  server_name _;
  ssl_certificate /etc/nginx/certs/tls.crt;
  ssl_certificate_key /etc/nginx/certs/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  root /usr/share/nginx/html;
  index control-login.html;
  # Keep Control cookies scoped away from a co-hosted data plane.  The same
  # public path is used by the 3030 gateway configuration.
  location ^~ /_control/api/ { proxy_pass http://control_auth:8000/api/; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location = /health { proxy_pass http://control_auth:8000; }
  location / { try_files $uri $uri/ /control-login.html; }
}
