# One compose project equals one KM data plane.  Start it with one of the
# instance env files and a unique COMPOSE_PROJECT_NAME (km-test/km-da40/km-rd2).
# Never attach a service in this file to another instance's network or volume.
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5

  report_registry:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KM_REPORT_DB_NAME}
      POSTGRES_USER: ${KM_REPORT_DB_USER}
      POSTGRES_PASSWORD: ${KM_REPORT_DB_PASSWORD:?required}
    volumes: [report_registry_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:2026.03.1
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?required}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: [CMD-SHELL, '/var/lib/neo4j/bin/cypher-shell -u neo4j -p "$${NEO4J_AUTH#neo4j/}" "RETURN 1"']
      interval: 30s
      timeout: 10s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.16.2
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O - http://127.0.0.1:6333/healthz >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KM_TIMESCALE_DB_NAME}
      POSTGRES_USER: ${KM_TIMESCALE_DB_USER}
      POSTGRES_PASSWORD: ${KM_TIMESCALE_DB_PASSWORD:?required}
    volumes: [timescaledb_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: {context: ../.., dockerfile: Dockerfile}
    restart: unless-stopped
    environment: &km_environment
      KM_INSTANCE_ID: ${KM_INSTANCE_ID}
      KM_REDIS_KEY_PREFIX: "km:${KM_INSTANCE_ID}:"
      KM_SESSION_SIGNING_KEY: ${KM_SESSION_SIGNING_KEY:?required}
      KM_ENTRY_SESSION_SIGNING_KEY: ${KM_ENTRY_SESSION_SIGNING_KEY:?required}
      KM_CONTROL_DB_URL: ${KM_CONTROL_DB_URL:?required}
      KM_CONTROL_PUBLIC_ORIGIN: ${KM_CONTROL_PUBLIC_ORIGIN:?required}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?required}
      QDRANT_URL: http://qdrant:6333
      TIMESCALEDB_URL: postgresql://${KM_TIMESCALE_DB_USER}:${KM_TIMESCALE_DB_PASSWORD}@timescaledb:5432/${KM_TIMESCALE_DB_NAME}
      KB_REPORT_REGISTRY_URL: postgresql://${KM_REPORT_DB_USER}:${KM_REPORT_DB_PASSWORD}@report_registry:5432/${KM_REPORT_DB_NAME}
      KB_ACCOUNT_REGISTRY_URL: postgresql://${KM_REPORT_DB_USER}:${KM_REPORT_DB_PASSWORD}@report_registry:5432/${KM_REPORT_DB_NAME}
      KB_INGEST_UPLOAD_ROOT: /app/data/uploads
      KB_REPORT_STAGING_ROOT: /app/data/report-staging
      KB_ASSETS_ROOT: /app/data/assets
      KB_INGEST_REGISTRY_URL: sqlite:////app/data/ingestion-registry.sqlite3
    volumes:
      - instance_data:/app/data
    depends_on:
      redis: {condition: service_healthy}
      report_registry: {condition: service_healthy}
      neo4j: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      timescaledb: {condition: service_healthy}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    networks: [default, control_network]

  celery_search_worker:
    build: {context: ../.., dockerfile: Dockerfile}
    restart: unless-stopped
    environment: *km_environment
    volumes: [instance_data:/app/data]
    depends_on: {redis: {condition: service_healthy}, neo4j: {condition: service_healthy}, qdrant: {condition: service_healthy}}
    command: celery -A src.web_api.tasks:celery_app worker --loglevel=info --concurrency=2 -Q search

  celery_ingest_worker:
    build: {context: ../.., dockerfile: Dockerfile}
    restart: unless-stopped
    environment: *km_environment
    volumes: [instance_data:/app/data]
    depends_on: {redis: {condition: service_healthy}, neo4j: {condition: service_healthy}, qdrant: {condition: service_healthy}, report_registry: {condition: service_healthy}, timescaledb: {condition: service_healthy}}
    command: celery -A src.web_api.tasks:celery_app worker --loglevel=info --concurrency=1 -Q ingest

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports: ["${KM_WEB_BIND_ADDRESS:-127.0.0.1}:${KM_HTTPS_PORT:?required}:443"]
    volumes:
      - ../../frontend:/usr/share/nginx/html:ro
      - ./nginx.instance.conf:/etc/nginx/conf.d/default.conf:ro
      - ${KM_TLS_CERT_PATH:?required}:/etc/nginx/certs/tls.crt:ro
      - ${KM_TLS_KEY_PATH:?required}:/etc/nginx/certs/tls.key:ro
    depends_on: [web]

volumes:
  redis_data: {}
  report_registry_data: {}
  neo4j_data: {}
  neo4j_logs: {}
  qdrant_storage: {}
  qdrant_snapshots: {}
  timescaledb_data: {}
  instance_data: {}

networks:
  control_network:
    external: true
    name: ${KM_CONTROL_NETWORK:-km-control-private}
