server {
  listen 443 ssl;
  server_name _;
  ssl_certificate /etc/nginx/certs/tls.crt;
  ssl_certificate_key /etc/nginx/certs/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  root /usr/share/nginx/html;
  index login.html;
  client_max_body_size 200m;

  location /api/ { proxy_pass http://web:8000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location = /search { proxy_pass http://web:8000; proxy_http_version 1.1; }
  location ^~ /tasks/ { proxy_pass http://web:8000; proxy_http_version 1.1; }
  location = /health { proxy_pass http://web:8000; proxy_http_version 1.1; }
  location /ws { proxy_pass http://web:8000/ws; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection upgrade; }
  location / { try_files $uri $uri/ /login.html; }
}
