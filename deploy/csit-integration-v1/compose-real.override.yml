# Real CSIT mode: the base deploy/csit-integration-v1/compose.yaml (real identity authority, real CSIT, public schema) with the v1.4.1 settings on.
# Used as: docker compose -p km-csit-v1-dev --env-file <deploy-da40.env> -f compose.yaml -f compose-real.override.yml
# Everything the live mode (compose-live.yml) switches on for the real data is switched on here too, so that going from live to real only changes who the CSIT is.
# Not here (the protected env file KM_CSIT_ENV_FILE holds them, they come from the real CSIT): KM_CSIT_AUTHORITY, KM_CSIT_JWKS_URI, KM_CSIT_TOKEN_URL, KM_CSIT_CSIT_BASE_URL,
# KM_CSIT_AUDIENCE, KM_CSIT_OUTBOUND_AUDIENCE, KM_CSIT_CLIENT_ID, KM_CSIT_SECRET_FILE, KM_CSIT_SERVICE_CLIENTS, KM_CSIT_SERVICE_CLAIM, KM_CSIT_SERVICE_CLAIM_VALUE.
x-real-env: &real-env
  KM_CSIT_MODE: real
  KM_CSIT_ENABLED: "true"
  KM_CSIT_DOCLIB_ENABLED: "true"
  # The real CSIT identity server (checked 2026-11-10: discovery, scopes_supported) registers only km.ingestion.submit, csit.document.read and csit.ingestion.status.write.
  # Asking it for an unregistered scope would fail the whole token request, so the first real test asks for the registered pair: Test Report v1 and document-library v1.
  # The v2 callbacks (verification attachments, vendor, equipment, metadata change, v2 deletion) need csit.km.status.write and csit.km.deletion-status.write as well
  # (v1.4.1 C.3): add them here once CSIT has registered them and the M2M contract test passed.
  # The v1 deletion callback (POST /api/integrations/km/v1/document-deletion-status) needs csit.km.deletion-status.write, not csit.ingestion.status.write
  # (CSIT Runtime 8fe25c60, round 2 reply 2026-11-11). It is not requested until CSIT confirms the IdP grants it; without it KM does not send that callback,
  # so no v1 deletion E2E can run before then.
  KM_CSIT_OUTBOUND_SCOPES: csit.document.read,csit.ingestion.status.write
  # true: the full Shared Identity check (principal_type, client_id, sub as well as issuer, audience, expiry, scope). CSIT's reply of 2026-11-10 does not accept a relaxed check
  # without its Owner's approval; the relaxed mode stays in the code but is not switched on here.
  KM_CSIT_OUTBOUND_STRICT: "true"
  # v1.4.1 C.2: stays off until CSIT has deployed the Test Report Correlation Resolver (task C).
  KM_CSIT_ANALYSIS_RESULTS_ENABLED: "false"
  KM_CSIT_DOCLIB_LLM: "1"
  KM_CSIT_LLM_BASE_URL: http://host.docker.internal:18080/v1
  KM_CSIT_LLM_MODEL: gpt-5.6-luna
  KM_CSIT_LLM_API_KEY_FILE: /run/secrets/llm-api-key
  KM_CSIT_DOCLIB_QDRANT_COLLECTION: km_csit_docs
  KM_CSIT_DOCLIB_REDIS_URL: redis://km-da40-redis-1:6379/0
  KM_CSIT_REPORT_TEMPLATES: "1"
services:
  api:
    image: ${KM_CSIT_API_IMAGE:?}
    environment: *real-env
  worker:
    image: ${KM_CSIT_WORKER_IMAGE:?}
    environment: *real-env
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ${KM_MODE_DIR}/hf-cache:/root/.cache/huggingface   # the embedding model, seeded once: a recreated worker must not download it again
      - ${KM_MODE_DIR}/llm/api-key:/run/secrets/llm-api-key:ro
      # A private CA of the real CSIT: mount it and set SSL_CERT_FILE above, e.g.
      #   - ${KM_MODE_DIR}/csit-real-ca.pem:/run/secrets/csit-ca.pem:ro   with   SSL_CERT_FILE: /run/secrets/csit-ca.pem
