services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: km_test
      POSTGRES_DB: km_test
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U km_test -d km_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs: [/var/lib/postgresql/data]
  graph:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: none
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    healthcheck:
      test: ["CMD","cypher-shell","RETURN 1"]
      interval: 5s
      timeout: 10s
      retries: 30
  tests:
    build:
      context: ../..
      dockerfile: deploy/csit-integration-v1/Dockerfile
      target: test
    environment:
      TEST_DATABASE_URL: postgresql://km_test@db/km_test
      TEST_TIMESCALE_URL: postgresql://km_test@db/km_test
      TEST_NEO4J_URI: bolt://graph:7687
    depends_on:
      db: {condition: service_healthy}
      graph: {condition: service_healthy}
networks:
  default:
    internal: true
