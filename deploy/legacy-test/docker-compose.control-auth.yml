# Independent Control DB/Auth for the existing Test data plane. It has no
# published port: the existing 3030 Nginx gateway is its only public path.
services:
  control_db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: km_control
      POSTGRES_USER: km_control_app
      POSTGRES_PASSWORD: ${KM_CONTROL_DB_PASSWORD:?required}
    volumes: [control_db_data:/var/lib/postgresql/data]
    networks:
      control_network:
        aliases: [km-control-db]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5

  control_auth:
    build: {context: ../.., dockerfile: Dockerfile}
    restart: unless-stopped
    environment:
      KM_CONTROL_DB_URL: postgresql://km_control_app:${KM_CONTROL_DB_PASSWORD}@km-control-db:5432/km_control
      KM_CONTROL_SESSION_SIGNING_KEY: ${KM_CONTROL_SESSION_SIGNING_KEY:?required}
      KM_CONTROL_COOKIE_PATH: /_control/
      KM_ENABLED_INSTANCE_IDS: test
      KM_TEST_PUBLIC_ORIGIN: ${KM_TEST_PUBLIC_ORIGIN:?required}
      # Disabled unless a trusted DEV FQDN and registered Shared Identity
      # metadata are explicitly configured.
      KM_OIDC_ENABLED: ${KM_OIDC_ENABLED:-false}
      KM_OIDC_CLIENT_AUTH_METHOD: ${KM_OIDC_CLIENT_AUTH_METHOD:-client_secret_basic}
      KM_OIDC_ISSUER: ${KM_OIDC_ISSUER:-}
      KM_OIDC_AUTHORIZATION_ENDPOINT: ${KM_OIDC_AUTHORIZATION_ENDPOINT:-}
      KM_OIDC_TOKEN_ENDPOINT: ${KM_OIDC_TOKEN_ENDPOINT:-}
      KM_OIDC_JWKS_URI: ${KM_OIDC_JWKS_URI:-}
      KM_OIDC_END_SESSION_ENDPOINT: ${KM_OIDC_END_SESSION_ENDPOINT:-}
      KM_OIDC_CLIENT_ID: ${KM_OIDC_CLIENT_ID:-}
      KM_OIDC_ID_TOKEN_ALGORITHMS: ${KM_OIDC_ID_TOKEN_ALGORITHMS:-RS256}
      KM_OIDC_CLIENT_SECRET: ${KM_OIDC_CLIENT_SECRET:-}
      KM_OIDC_REDIRECT_URI: ${KM_OIDC_REDIRECT_URI:-}
      KM_OIDC_POST_LOGOUT_REDIRECT_URI: ${KM_OIDC_POST_LOGOUT_REDIRECT_URI:-}
      KM_OIDC_PRIVATE_KEY_PATH: ${KM_OIDC_PRIVATE_KEY_PATH:-}
      KM_OIDC_PRIVATE_KEY_KID: ${KM_OIDC_PRIVATE_KEY_KID:-}
      KM_OIDC_CLIENT_JWKS_PATH: ${KM_OIDC_CLIENT_JWKS_PATH:-}
      KM_OIDC_BINDING_SIGNING_KEY: ${KM_OIDC_BINDING_SIGNING_KEY:-}
      KM_OIDC_CLAIM_MAPPING_JSON: ${KM_OIDC_CLAIM_MAPPING_JSON:-}
    command: uvicorn app.control_main:app --host 0.0.0.0 --port 8000 --workers 2
    depends_on:
      control_db: {condition: service_healthy}
    networks:
      control_network:
        aliases: [km-control-auth]

volumes:
  control_db_data: {}

networks:
  control_network:
    name: ${KM_CONTROL_NETWORK:-km-control-private}
