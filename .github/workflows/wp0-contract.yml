name: WP0 Contract Baseline

on:
  push:
    branches:
      - agent/wp0-fastapi-contract
  pull_request:
    branches:
      - agent/km-modify-codex-plan
      - dev-work

permissions:
  contents: read

concurrency:
  group: wp0-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q tests

      - name: Compile Python sources
        run: python -m compileall -q app src km_a2a_bridge tests

      - name: Validate Compose configuration
        env:
          KB_REPORT_DB_PASSWORD: ci-only-report-password
          NEO4J_PASSWORD: ci-only-neo4j-password
        run: docker compose config --quiet

      - name: Check shell syntax
        run: bash -n start.sh restart_kb.sh release/build_release.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha || github.event.before }}" "${{ github.sha }}"

      - name: Check common credential patterns
        run: |
          if git grep -n -E '(^|[^A-Za-z])(sk-[A-Za-z0-9]{20,}|gh[pousr]_[A-Za-z0-9_]{20,}|-----BEGIN ([A-Z ]+ )?PRIVATE KEY-----)' -- .; then
            echo "Potential credential pattern found"
            exit 1
          fi
