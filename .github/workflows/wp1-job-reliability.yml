name: WP1 Job Reliability

on:
  workflow_dispatch:
  push:
    branches:
      - agent/wp1-job-config-reliability
      - "agent/*-v2.6-acceptance"
  pull_request:
    branches:
      - agent/km-plan-v2.6-anderson
      - agent/wp1-release-convergence
      - agent/wp0-fastapi-contract
      - agent/km-modify-codex-plan
      - dev-work

permissions:
  contents: read

concurrency:
  group: wp1-job-reliability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run test suite
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q app src
      - name: Validate Compose configuration
        env:
          NEO4J_PASSWORD: ci-neo4j-password
          KB_REPORT_DB_PASSWORD: ci-report-db-password
        run: docker compose config --quiet
      - name: Validate shell scripts
        run: bash -n start.sh restart_kb.sh scripts/build_release_package.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whitespace errors
        run: git diff --check "${{ github.event.pull_request.base.sha || github.event.before }}" "${{ github.sha }}"
      - name: Scan committed files for common credentials
        run: |
          ! git grep -nI -E '(^|[^A-Za-z0-9])(sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9_]{20,}|-----BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY-----)' -- ':!*.lock'
