name: KM handoff regression
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/csit_v1/**'
      - 'tests/control_v1/**'
      - 'deploy/csit-integration-v1/**'
      - 'migrations/**'
      - 'scripts/test-csit-handoff.sh'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-csit-handoff.sh
