name: KM CSIT notification receiver

on:
  pull_request:
    paths:
      - 'src/csit/notification.py'
      - 'src/csit/__init__.py'
      - 'src/web_api/csit_notification_routes.py'
      - 'src/web_api/__init__.py'
      - 'tests/test_csit_notification_receiver.py'
      - 'docs/contracts/csit/**'
      - 'docs/km-csit-notification-*.md'
      - '.github/workflows/csit-notification-receiver.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    env:
      KM_CSIT_NOTIFICATION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest fastapi httpx pydantic
      - run: python -m pytest -q tests/test_csit_notification_receiver.py
      - run: python -m compileall -q src/csit/notification.py src/web_api/csit_notification_routes.py
