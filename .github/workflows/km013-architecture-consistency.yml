name: KM013 Architecture Consistency

on:
  pull_request:
  push:
    branches:
      - main
      - phase1-km013-20260903

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate architecture claims
        run: python scripts/validate_architecture_consistency.py
