name: KM v2.6 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: km-v26-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate KM progress manifest
        run: python scripts/validate_phase1_status.py docs/phase1-status-manifest.json
      - name: Run KM test suite
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q src scripts
      - name: Validate Compose configuration
        env:
          NEO4J_PASSWORD: ci-neo4j-password
          KB_REPORT_DB_PASSWORD: ci-report-db-password
        run: docker compose config --quiet
      - name: Validate shell scripts
        run: bash -n start.sh restart_kb.sh scripts/*.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build frontend in runner workspace
        run: npx vite build --outDir "$RUNNER_TEMP/km-frontend-build"

  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whitespace errors
        run: git diff --check "${{ github.event.pull_request.base.sha || github.event.before }}" "${{ github.sha }}"
      - name: Scan repository for common credentials
        run: |
          ! git grep -nI -E '(^|[^A-Za-z0-9])(sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9_]{20,}|-----BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY-----)' -- ':!*.lock'
